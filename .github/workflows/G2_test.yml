name: Automation
on:
  workflow_dispatch:
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium
      - name: Run automation scripts
        env:
          G2_SHINKOU_JS: ${{ secrets.G2_SHINKOU_JS }}
          G2_KYUEN_JS: ${{ secrets.G2_KYUEN_JS }}
        run: |
          echo "Running G2_SHINKOU_JS..."
          echo "$G2_SHINKOU_JS" > g2_shinkou.js
          node g2_shinkou.js

          for i in {1..4}; do
            echo "=== Cycle $i/4 ==="

            WAIT_TIME=$((240 + RANDOM % 61))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME

            echo "Running G2_KYUEN_JS (1st time in cycle $i)..."
            echo "$G2_KYUEN_JS" > g2_kyuen.js
            node g2_kyuen.js

            WAIT_TIME=$((240 + RANDOM % 61))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME

            echo "Running G2_KYUEN_JS (2nd time in cycle $i)..."
            node g2_kyuen.js
          done

          echo "All cycles completed!"
      - name: Cleanup
        if: always()
        run: |
          rm -f g2_shinkou.js g2_kyuen.js
