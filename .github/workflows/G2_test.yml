name: Automation
on:
  workflow_dispatch:
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium
      - name: Run automation scripts
        env:
          G2_SHINKOU_JS: ${{ secrets.G2_SHINKOU_JS }}
          G2_KYUEN_JS: ${{ secrets.G2_KYUEN_JS }}
        run: |
          echo "$G2_SHINKOU_JS" > g2_shinkou.js
          echo "$G2_KYUEN_JS" > g2_kyuen.js
          
          # ── 事前実行 ─────────────────────────
          echo "Running G2_SHINKOU_JS..."
          node g2_shinkou.js
          
          # ── 繰り返し実行: 10回 ─────────────────────────
          for i in {1..10}; do
            echo "=== Repeat $i/10 ==="
            
            WAIT_TIME=$((60 + RANDOM % 60))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            
            echo "Running G2_KYUEN_JS ($i/10)..."
            node g2_kyuen.js
          done
          
          echo "All done!"
      - name: Cleanup
        if: always()
        run: |
          rm -f g2_shinkou.js g2_kyuen.js
