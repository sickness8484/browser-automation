name: Automation
on:
  workflow_dispatch:
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium
      - name: Run automation scripts
        env:
          J2_TEST_JS: ${{ secrets.J2_TEST_JS }}
          J2_KYUEN_JS: ${{ secrets.J2_KYUEN_JS }}
        run: |
          # J2_TEST_JS を実行
          echo "Running J2_TEST_JS..."
          echo "$J2_TEST_JS" > j2_test.js
          node j2_test.js
          
          # 5回のループ
          for i in {1..5}; do
            echo "=== Cycle $i/5 ==="
            
            # 3〜4分のランダム待機
            WAIT_TIME=$((180 + RANDOM % 61))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            
            # J2_KYUEN_JS を実行
            echo "Running J2_KYUEN_JS (1st time in cycle $i)..."
            echo "$J2_KYUEN_JS" > j2_kyuen.js
            node j2_kyuen.js
            
            # 3〜4分のランダム待機
            WAIT_TIME=$((180 + RANDOM % 61))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            
            # J2_KYUEN_JS を再度実行
            echo "Running J2_KYUEN_JS (2nd time in cycle $i)..."
            node j2_kyuen.js
          done
          
          echo "All cycles completed!"
      - name: Cleanup
        if: always()
        run: |
          rm -f j2_test.js j2_kyuen.js
