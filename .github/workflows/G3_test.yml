name: Automation
on:
  workflow_dispatch:
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium
      - name: Run automation scripts
        env:
          G3_TEST_JS: ${{ secrets.G3_TEST_JS }}
          G3_KYUEN_JS: ${{ secrets.G3_KYUEN_JS }}
        run: |
          echo "$G3_TEST_JS" > g3_test.js
          echo "$G3_KYUEN_JS" > g3_kyuen.js
          
          # ── 事前実行 ─────────────────────────
          echo "Running G3_TEST_JS..."
          node g3_test.js
          
          # ── 8回のループ ─────────────────────────
          for i in {1..8}; do
            echo "=== Cycle $i/8 ==="
            
            WAIT_TIME=$((110 + RANDOM % 60))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            
            echo "Running G3_KYUEN_JS (1/2 in cycle $i)..."
            node g3_kyuen.js
            WAIT_TIME=$((60 + RANDOM % 31))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            echo "Running G3_KYUEN_JS (2/2 in cycle $i)..."
            node g3_kyuen.js
          done
          
          echo "All done!"
      - name: Cleanup
        if: always()
        run: |
          rm -f g3_test.js g3_kyuen.js
