name: runner

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}

    steps:
      - name: parse
        id: parse
        env:
          DATA: ${{ secrets.DATA }}
          GROUP_SIZE: ${{ secrets.GROUP_SIZE }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          raw = os.environ.get('DATA', '').replace('\r', '').strip()
          print('DATA length =', len(raw))

          if not raw:
              print('parse error: DATA is empty', file=sys.stderr)
              sys.exit(1)

          group_size = int(os.environ.get('GROUP_SIZE') or 3)

          blocks = [b.strip() for b in raw.split('---')]
          print('blocks =', len(blocks))

          if len(blocks) < 3:
              print('parse error: DATA must be urls --- names --- emails', file=sys.stderr)
              sys.exit(1)

          urls = [s.strip() for s in blocks[0].splitlines() if s.strip()]
          names = [s.strip() for s in blocks[1].splitlines() if s.strip()]
          emails = [s.strip() for s in blocks[2].splitlines() if s.strip()]

          print('urls=', len(urls), 'names=', len(names), 'emails=', len(emails))

          count = min(len(urls), len(names), len(emails))
          if count == 0:
              print('parse error: no valid accounts', file=sys.stderr)
              sys.exit(1)

          accounts = [
              {'url': urls[i], 'name': names[i], 'email': emails[i]}
              for i in range(count)
          ]

          groups = []
          for i in range(0, len(accounts), group_size):
              groups.append({'accounts': accounts[i:i + group_size]})

          matrix = json.dumps({'group': groups}, ensure_ascii=False)

          print('MATRIX=', matrix)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('matrix=' + matrix + '\n')
          PYEOF

      - name: debug output
        run: |
          echo 'matrix output:'
          echo '${{ steps.parse.outputs.matrix }}'

  run:
    needs: prepare
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 20
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: setup script
        env:
          SCRIPT: ${{ secrets.SCRIPT }}
        run: |
          printf '%s' "$SCRIPT" > worker.js

      - name: install
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: exec
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PASS: ${{ secrets.COMMON_PASS }}
          GROUP_JSON: ${{ toJson(matrix.group.accounts) }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys, time

          accounts = json.loads(os.environ['GROUP_JSON'])
          wait_sec = 3
          results = []

          for i, acct in enumerate(accounts):
              print(f'[{i+1}/{len(accounts)}] {acct["name"]}')

              env = {
                  **os.environ,
                  'ENTRY_URL': acct['url'],
                  'HANDLE': acct['name'],
                  'MAIL': acct['email'],
              }

              ret = subprocess.run(['node', 'worker.js'], env=env)
              status = 'ok' if ret.returncode == 0 else 'fail'
              results.append({'name': acct['name'], 'status': status})

              if i < len(accounts) - 1:
                  time.sleep(wait_sec)

          print('\n-- summary --')
          for r in results:
              print(f'{"✅" if r["status"] == "ok" else "❌"} {r["name"]}')

          if any(r['status'] == 'fail' for r in results):
              sys.exit(1)
          PYEOF
