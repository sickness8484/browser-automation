name: runner

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}

    steps:
      - name: parse matrix
        id: parse
        env:
          DATA: ${{ secrets.DATA }}
          GROUP_SIZE: ${{ secrets.GROUP_SIZE }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, math

          raw = os.environ.get('DATA', '').replace('\r', '').strip()
          if not raw:
              print('parse error: DATA is empty', file=sys.stderr)
              sys.exit(1)

          group_size_raw = os.environ.get('GROUP_SIZE') or '3'
          try:
              group_size = int(group_size_raw)
              if group_size <= 0:
                  raise ValueError
          except ValueError:
              print('parse error: GROUP_SIZE must be positive integer', file=sys.stderr)
              sys.exit(1)

          blocks = [b.strip() for b in raw.split('---')]
          if len(blocks) < 3:
              print('parse error: DATA must be 3 blocks: urls --- names --- emails', file=sys.stderr)
              sys.exit(1)

          urls = [s.strip() for s in blocks[0].splitlines() if s.strip()]
          names = [s.strip() for s in blocks[1].splitlines() if s.strip()]
          emails = [s.strip() for s in blocks[2].splitlines() if s.strip()]

          count = min(len(urls), len(names), len(emails))
          if count == 0:
              print('parse error: no valid accounts', file=sys.stderr)
              sys.exit(1)

          group_count = math.ceil(count / group_size)

          # 重要:
          # ここには Secret の中身を絶対に入れない。
          # GitHub Actions が secret 混入と判定すると output が空になる。
          matrix = {
              'group': [
                  {'index': i}
                  for i in range(group_count)
              ]
          }

          print(f'total_accounts={count}')
          print(f'group_size={group_size}')
          print(f'group_count={group_count}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('matrix=' + json.dumps(matrix) + '\n')
          PYEOF

  run:
    needs: prepare

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 20
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: setup script
        env:
          SCRIPT: ${{ secrets.SCRIPT }}
        run: |
          printf '%s' "$SCRIPT" > worker.js

      - name: install
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: exec
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PASS: ${{ secrets.COMMON_PASS }}
          DATA: ${{ secrets.DATA }}
          GROUP_SIZE: ${{ secrets.GROUP_SIZE }}
          GROUP_INDEX: ${{ matrix.group.index }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys, time

          raw = os.environ.get('DATA', '').replace('\r', '').strip()
          if not raw:
              print('exec error: DATA is empty', file=sys.stderr)
              sys.exit(1)

          group_size = int(os.environ.get('GROUP_SIZE') or 3)
          group_index = int(os.environ.get('GROUP_INDEX') or 0)

          blocks = [b.strip() for b in raw.split('---')]
          if len(blocks) < 3:
              print('exec error: DATA must be 3 blocks: urls --- names --- emails', file=sys.stderr)
              sys.exit(1)

          urls = [s.strip() for s in blocks[0].splitlines() if s.strip()]
          names = [s.strip() for s in blocks[1].splitlines() if s.strip()]
          emails = [s.strip() for s in blocks[2].splitlines() if s.strip()]

          count = min(len(urls), len(names), len(emails))
          accounts = [
              {
                  'url': urls[i],
                  'name': names[i],
                  'email': emails[i],
              }
              for i in range(count)
          ]

          start = group_index * group_size
          end = start + group_size
          group_accounts = accounts[start:end]

          if not group_accounts:
              print(f'group {group_index}: no accounts')
              sys.exit(0)

          wait_sec = int(os.environ.get('WAIT_SEC') or 3)
          results = []

          print(f'group_index={group_index}')
          print(f'accounts_in_group={len(group_accounts)}')

          for i, acct in enumerate(group_accounts):
              print(f'[{i+1}/{len(group_accounts)}] {acct["name"]}')
              sys.stdout.flush()

              env = {
                  **os.environ,
                  'ENTRY_URL': acct['url'],
                  'HANDLE': acct['name'],
                  'MAIL': acct['email'],
              }

              ret = subprocess.run(['node', 'worker.js'], env=env)

              status = 'ok' if ret.returncode == 0 else 'fail'
              results.append({
                  'name': acct['name'],
                  'status': status,
              })

              if i < len(group_accounts) - 1:
                  time.sleep(wait_sec)

          print('\n-- summary --')
          for r in results:
              mark = '✅' if r['status'] == 'ok' else '❌'
              print(f'{mark} {r["name"]}')

          if any(r['status'] == 'fail' for r in results):
              sys.exit(1)
          PYEOF
