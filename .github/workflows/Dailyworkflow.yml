name: Automation
on:
  workflow_dispatch:
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium
      - name: Run automation scripts
        env:
          DAILY_TASK_JS: ${{ secrets.DAILY_TASK_JS }}
        run: |
          echo "Running DAILY_TASK_JS..."
          echo "$DAILY_TASK_JS" > daily_task.js
          node daily_task.js
          echo "Completed!"
      - name: Cleanup
        if: always()
        run: |
          rm -f daily_task.js
