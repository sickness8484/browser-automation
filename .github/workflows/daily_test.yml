name: Daily Test

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm init -y && npm install playwright

      - run: npx playwright install --with-deps

      - env:
          DAILY_TEST_JS: ${{ secrets.DAILY_TEST_JS }}
        run: |
          echo "$DAILY_TEST_JS" > daily_test.js
          node daily_test.js
