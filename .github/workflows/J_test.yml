name: J1_raid

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm init -y && npm install playwright

      - run: npx playwright install --with-deps

      - env:
          J1_RAID_JS: ${{ secrets.J1_RAID_JS }}
        run: |
          echo "$J1_RAID_JS" > J1_raid_js.js
          node J1_raid_js.js
