name: Yobimodoshi Runner

on:
  workflow_dispatch:

jobs:
  run-yobimodoshi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Yobimodoshi Script
        env:
          YOBIMODOSHI: ${{ secrets.YOBIMODOSHI }}
        run: |
          echo "[Task] Starting"

          if [ -z "$YOBIMODOSHI" ]; then
            echo "::error::Secret YOBIMODOSHI is empty or not found"
            exit 1
          fi

          printf '%s' "$YOBIMODOSHI" > yobimodoshi.js

          echo "[Task] Script loaded"
          echo "[Task] bytes=$(wc -c < yobimodoshi.js)"
          echo "[Task] lines=$(wc -l < yobimodoshi.js)"

          node --check yobimodoshi.js
          echo "[Task] Syntax OK"

          node yobimodoshi.js

          rm -f yobimodoshi.js
          echo "[Task] Completed"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Yobimodoshi execution completed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━"
