name: DragonCraze Raid Economy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragoncraze-raid-economy
  cancel-in-progress: false

jobs:
  raid-economy:
    runs-on: ubuntu-latest

    # セットアップ、実行、ログ保存を含むジョブ全体の上限
    timeout-minutes: 30

    env:
      NODE_ENV: production

      # 同時実行アカウント数
      CONCURRENCY: "5"

      # レイド処理設定
      CYCLES: "12"
      MIN_WAIT_SECONDS: "60"
      MAX_WAIT_SECONDS: "120"

      # 自発用に確保するBP
      SELF_RESERVE_BP: "60"

      # 計測ログ
      RAID_MEASURE_FILE: "${{ github.workspace }}/raid_measurements.jsonl"

      # Node 20への一時退避は使用しない
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

          # package-lock.jsonがない環境でも失敗しないように無効化
          package-manager-cache: false

      - name: Show runtime versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "package-lock.json found: running npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "package.json found without lockfile: running npm install"
            npm install
          else
            echo "No package.json found: creating temporary npm project"
            npm init -y
          fi

          if node -e "require.resolve('playwright')" >/dev/null 2>&1; then
            echo "Playwright is already installed."
          else
            echo "Installing Playwright..."
            npm install --no-save playwright
          fi

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail

          npx playwright install --with-deps chromium

      - name: Verify raid script
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_FILE="dragoncraze_raid_economy_v4.js"

          if [ ! -f "$SCRIPT_FILE" ]; then
            echo "::error::${SCRIPT_FILE} がリポジトリ直下にありません。"
            echo ""
            echo "リポジトリ内のJavaScriptファイル:"
            find . -maxdepth 3 -type f -name "*.js" -print | sort
            exit 1
          fi

          FILE_SIZE="$(wc -c < "$SCRIPT_FILE")"

          echo "Script file : $SCRIPT_FILE"
          echo "Script size : $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "::error::スクリプトのサイズが小さすぎます。貼り付けが途中で切れている可能性があります。"
            exit 1
          fi

          node --check "$SCRIPT_FILE"

          echo "JavaScript syntax check passed."

      - name: Initialize measurement file
        shell: bash
        run: |
          set -euo pipefail

          : > "${GITHUB_WORKSPACE}/raid_measurements.jsonl"

          echo "Measurement file initialized:"
          echo "${GITHUB_WORKSPACE}/raid_measurements.jsonl"

      - name: Run raid economy
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_FILE="dragoncraze_raid_economy_v4.js"

          echo "========================================"
          echo "DragonCraze Raid Economy"
          echo "Node        : $(node --version)"
          echo "Concurrency : ${CONCURRENCY}"
          echo "Cycles      : ${CYCLES}"
          echo "Job timeout : 30 minutes"
          echo "Script limit: 25 minutes"
          echo "Started at  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "========================================"

          set +e

          # ジョブ全体30分より先に終了させ、
          # ログ出力とArtifact保存の時間を確保する
          timeout \
            --signal=TERM \
            --kill-after=20s \
            25m \
            node \
              --unhandled-rejections=strict \
              "$SCRIPT_FILE"

          EXIT_CODE=$?

          set -e

          echo "========================================"
          echo "Finished at : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Exit code   : ${EXIT_CODE}"
          echo "========================================"

          case "$EXIT_CODE" in
            0)
              echo "Raid script completed successfully."
              ;;

            124)
              echo "::notice::25分の内部制限に到達したため、スクリプトを終了しました。"
              exit 0
              ;;

            137)
              echo "::error::スクリプトが強制終了されました。メモリ不足または終了処理失敗の可能性があります。"
              exit 137
              ;;

            143)
              echo "::notice::タイムアウトのTERMシグナルにより終了しました。"
              exit 0
              ;;

            *)
              echo "::error::レイドスクリプトがエラー終了しました。終了コード: ${EXIT_CODE}"
              exit "$EXIT_CODE"
              ;;
          esac

      - name: Show measurement summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          FILE="${GITHUB_WORKSPACE}/raid_measurements.jsonl"

          echo "========================================"
          echo "Measurement summary"
          echo "========================================"

          if [ ! -f "$FILE" ]; then
            echo "raid_measurements.jsonl は存在しません。"
            exit 0
          fi

          FILE_SIZE="$(wc -c < "$FILE")"
          LINE_COUNT="$(wc -l < "$FILE")"

          echo "Path : $FILE"
          echo "Size : $FILE_SIZE bytes"
          echo "Lines: $LINE_COUNT"

          if [ "$LINE_COUNT" -gt 0 ]; then
            echo ""
            echo "Last 30 records:"
            tail -n 30 "$FILE" || true
          else
            echo ""
            echo "計測レコードはまだ書き込まれていません。"
          fi

      - name: Upload raid measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raid-measurements-${{ github.run_id }}
          path: raid_measurements.jsonl
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
