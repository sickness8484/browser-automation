name: J1 Raid Economy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1-raid-economy
  cancel-in-progress: false

jobs:
  raid-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: production
      CONCURRENCY: "5"
      CYCLES: "12"
      MIN_WAIT_SECONDS: "60"
      MAX_WAIT_SECONDS: "120"
      SELF_RESERVE_BP: "60"
      RAID_MEASURE_FILE: "${{ github.workspace }}/raid_measurements.jsonl"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Show runtime versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Node: $(node --version)"
          echo "npm : $(npm --version)"

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Create J1 raid script
        shell: bash
        env:
          RAID_SCRIPT_SOURCE: ${{ secrets.j1_raid_js }}
        run: |
          set -euo pipefail

          SCRIPT_FILE="j1_raid.js"

          if [ -z "${RAID_SCRIPT_SOURCE:-}" ]; then
            echo "::error::Secret j1_raid_js が未設定、または空です。"
            exit 1
          fi

          printf '%s' "$RAID_SCRIPT_SOURCE" > "$SCRIPT_FILE"

          FILE_SIZE="$(wc -c < "$SCRIPT_FILE")"

          echo "Script created: $SCRIPT_FILE"
          echo "Script size   : $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "::error::生成されたJSが小さすぎます。Secretへの貼り付けが途中で切れている可能性があります。"
            exit 1
          fi

          node --check "$SCRIPT_FILE"

          echo "JavaScript syntax check passed."

      - name: Initialize measurement file
        shell: bash
        run: |
          set -euo pipefail

          : > "${GITHUB_WORKSPACE}/raid_measurements.jsonl"

          echo "Measurement file initialized:"
          echo "${GITHUB_WORKSPACE}/raid_measurements.jsonl"

      - name: Run J1 raid script
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_FILE="j1_raid.js"

          if [ ! -f "$SCRIPT_FILE" ]; then
            echo "::error::${SCRIPT_FILE} が存在しません。"
            exit 1
          fi

          echo "========================================"
          echo "J1 Raid Economy"
          echo "Node        : $(node --version)"
          echo "Concurrency : ${CONCURRENCY}"
          echo "Cycles      : ${CYCLES}"
          echo "Job timeout : 30 minutes"
          echo "Script limit: 25 minutes"
          echo "Started at  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "========================================"

          set +e

          timeout \
            --signal=TERM \
            --kill-after=20s \
            25m \
            node \
              --unhandled-rejections=strict \
              "$SCRIPT_FILE"

          EXIT_CODE=$?

          set -e

          echo "========================================"
          echo "Finished at : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Exit code   : ${EXIT_CODE}"
          echo "========================================"

          case "$EXIT_CODE" in
            0)
              echo "J1 raid script completed successfully."
              ;;

            124)
              echo "::notice::25分の内部タイムアウトに到達したため終了しました。"
              exit 0
              ;;

            143)
              echo "::notice::TERMシグナルによって停止しました。"
              exit 0
              ;;

            137)
              echo "::error::強制終了されました。メモリ不足または停止処理失敗の可能性があります。"
              exit 137
              ;;

            *)
              echo "::error::スクリプトがエラー終了しました。終了コード: ${EXIT_CODE}"
              exit "$EXIT_CODE"
              ;;
          esac

      - name: Show measurement summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          FILE="${GITHUB_WORKSPACE}/raid_measurements.jsonl"

          echo "========================================"
          echo "Measurement summary"
          echo "========================================"

          if [ ! -f "$FILE" ]; then
            echo "raid_measurements.jsonl は生成されませんでした。"
            exit 0
          fi

          FILE_SIZE="$(wc -c < "$FILE")"
          LINE_COUNT="$(wc -l < "$FILE")"

          echo "Path : $FILE"
          echo "Size : $FILE_SIZE bytes"
          echo "Lines: $LINE_COUNT"

          if [ -s "$FILE" ]; then
            echo ""
            echo "Last 30 records:"
            tail -n 30 "$FILE" || true
          else
            echo "計測レコードはありません。"
          fi

      - name: Upload raid measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raid-measurements-${{ github.run_id }}
          path: raid_measurements.jsonl
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
