name: DragonCraze Raid Economy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragoncraze-raid-economy
  cancel-in-progress: false

jobs:
  raid-economy:
    runs-on: ubuntu-latest

    # セットアップ時間を含め、ジョブ全体を30分で終了
    timeout-minutes: 30

    env:
      NODE_ENV: production

      # 複数アカウントの同時実行数
      CONCURRENCY: "5"

      # スクリプト側が対応している場合に使用
      CYCLES: "12"
      MIN_WAIT_SECONDS: "60"
      MAX_WAIT_SECONDS: "120"

      # 自発用に残すBP
      SELF_RESERVE_BP: "60"

      # ログファイルの保存先
      RAID_MEASURE_FILE: "${{ github.workspace }}/raid_measurements.jsonl"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            npm init -y
          fi

          # package.jsonにPlaywrightが入っていない場合にも対応
          if ! node -e "require.resolve('playwright')" >/dev/null 2>&1; then
            npm install --no-save playwright
          fi

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Verify script
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_FILE="dragoncraze_raid_economy_v4.js"

          if [ ! -f "$SCRIPT_FILE" ]; then
            echo "::error::${SCRIPT_FILE} がリポジトリ直下にありません。"
            echo "現在のファイル一覧:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Script: $SCRIPT_FILE"
          echo "Size: $(wc -c < "$SCRIPT_FILE") bytes"

          # JavaScriptの構文検査
          node --check "$SCRIPT_FILE"

          echo "JavaScript syntax check passed."

      - name: Run raid economy
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_FILE="dragoncraze_raid_economy_v4.js"

          echo "========================================"
          echo "DragonCraze Raid Economy"
          echo "Concurrency : ${CONCURRENCY}"
          echo "Job timeout : 30 minutes"
          echo "Script limit: 27 minutes"
          echo "Started at  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "========================================"

          # ジョブ全体の30分制限より先に止め、
          # 計測ファイルのアップロード時間を残す
          set +e
          timeout \
            --signal=TERM \
            --kill-after=20s \
            27m \
            node --unhandled-rejections=strict "$SCRIPT_FILE"

          EXIT_CODE=$?
          set -e

          echo "========================================"
          echo "Finished at : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Exit code   : ${EXIT_CODE}"
          echo "========================================"

          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "::notice::27分の内部実行制限に到達したため、正常に停止しました。"
            exit 0
          fi

          if [ "$EXIT_CODE" -eq 137 ]; then
            echo "::error::スクリプトが強制終了されました。メモリ不足または停止処理失敗の可能性があります。"
            exit 137
          fi

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::レイドスクリプトがエラー終了しました。終了コード: ${EXIT_CODE}"
            exit "$EXIT_CODE"
          fi

      - name: Show measurement summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          FILE="${GITHUB_WORKSPACE}/raid_measurements.jsonl"

          if [ ! -f "$FILE" ]; then
            echo "raid_measurements.jsonl は生成されませんでした。"
            exit 0
          fi

          echo "Measurement file:"
          echo "  Path : $FILE"
          echo "  Size : $(wc -c < "$FILE") bytes"
          echo "  Lines: $(wc -l < "$FILE")"

          echo ""
          echo "Last 20 measurement records:"
          tail -n 20 "$FILE" || true

      - name: Upload raid measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raid-measurements-${{ github.run_id }}
          path: raid_measurements.jsonl
          if-no-files-found: warn
          retention-days: 14
