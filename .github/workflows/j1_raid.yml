name: Browser Task A

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-task-a
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .task-state
          key: task-a-${{ github.ref_name }}
          restore-keys: |
            task-a-

      - name: Prepare bundle
        shell: bash
        env:
          BUNDLE: ${{ secrets.J1_RAID_JS }}
        run: |
          if [ -z "${BUNDLE:-}" ]; then
            echo "::error::Repository secret J1_RAID_JS is empty or unavailable."
            exit 1
          fi
          printf '%s' "$BUNDLE" > task.js
          node --check task.js
          CHECK_ONLY=1 node task.js > check.log
          grep -q 'SELF_TEST_OK_' check.log
          rm -f check.log

      - name: Execute bundle
        shell: bash
        env:
          CONCURRENCY: '6'
          RUN_BUDGET_MS: '1560000'
        run: |
          timeout --signal=TERM --kill-after=20s 28m node task.js
