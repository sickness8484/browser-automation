name: J1 Routine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      MAX_QUEST_ADVANCES: "15"
      MAX_QUEST_ITERATIONS: "40"
      MAX_RESCUE_HITS: "30"
      MAX_SAME_QUEST_STATE: "2"
      QUEST_HTTP_ENABLED: "1"
      QUEST_HTTP_FALLBACK_TO_BROWSER: "1"
      RAID_HTTP_ENABLED: "1"
      RAID_HTTP_FALLBACK_TO_BROWSER: "1"
      QUEST_HTTP_TIMEOUT_MS: "15000"
      RAID_HTTP_TIMEOUT_MS: "15000"
      STRICT_EXIT: "0"
      DRY_RUN: "0"
      LOG_LEVEL: "info"

    steps:
      - name: Clock
        shell: bash
        run: |
          set -euo pipefail

          START_TS="$(date +%s)"
          SAFE_END_TS="$((START_TS + 1740))"

          echo "START_TS=$START_TS" >> "$GITHUB_ENV"
          echo "SAFE_END_TS=$SAFE_END_TS" >> "$GITHUB_ENV"

      - name: Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Load
        shell: bash
        env:
          J1_DATA: ${{ secrets.J1_RAID_JS }}
        run: |
          set -euo pipefail
          umask 077

          TASK_DIR="$RUNNER_TEMP/j1"
          TASK_FILE="$TASK_DIR/main.cjs"

          rm -rf "$TASK_DIR"
          mkdir -p "$TASK_DIR"
          chmod 700 "$TASK_DIR"

          if [[ -z "${J1_DATA:-}" ]]; then
            echo "::error::Required data is empty."
            exit 1
          fi

          printf '%s' "$J1_DATA" > "$TASK_FILE"
          chmod 600 "$TASK_FILE"

          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "TASK_FILE=$TASK_FILE" >> "$GITHUB_ENV"

          unset J1_DATA

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const file = process.env.TASK_FILE;
          let code = fs.readFileSync(file, 'utf8');

          const before = 'n("CONCURRENCY",2,{min:1,max:4})';
          const after  = 'n("CONCURRENCY",5,{min:1,max:5})';

          if (code.includes(before)) {
            code = code.replace(before, after);
          } else {
            const launchers = [
              'eval(SOURCE);',
              "Function('require', 'process', 'Buffer', SOURCE)(require, process, Buffer);",
              'Function("require","process","Buffer",SOURCE)(require,process,Buffer);'
            ];

            const launcher = launchers.find(value => code.includes(value));

            if (!launcher || !code.includes('SOURCE')) {
              throw new Error('Runtime marker was not found.');
            }

            code = code.replace('const SOURCE =', 'let SOURCE =');

            const injection =
              `SOURCE = SOURCE.replace(${JSON.stringify(before)}, ${JSON.stringify(after)});\n`;

            code = code.replace(launcher, injection + launcher);
          }

          fs.writeFileSync(file, code, {
            encoding: 'utf8',
            mode: 0o600
          });
          NODE

          cd "$TASK_DIR"

          npm init -y >/dev/null 2>&1

          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            playwright

          npx playwright install --with-deps chromium

      - name: Check
        shell: bash
        run: |
          set -euo pipefail

          test -s "$TASK_FILE"
          node --check "$TASK_FILE"

      - name: Cycle
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0
          LONGEST=0
          FIRST_ESTIMATE=240
          END_MARGIN=20

          while true; do
            NOW="$(date +%s)"
            REMAINING="$((SAFE_END_TS - NOW))"

            if (( LONGEST > 0 )); then
              ESTIMATE="$(((LONGEST * 3 + 1) / 2 + 30))"

              if (( ESTIMATE < 180 )); then
                ESTIMATE=180
              fi
            else
              ESTIMATE="$FIRST_ESTIMATE"
            fi

            if (( REMAINING <= ESTIMATE + END_MARGIN )); then
              break
            fi

            COUNT="$((COUNT + 1))"
            RUN_START="$(date +%s)"
            RUN_LIMIT="$((REMAINING - END_MARGIN))"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Cycle #$COUNT"
            echo "Remaining: ${REMAINING}s"
            echo "Limit: ${RUN_LIMIT}s"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            set +e

            timeout \
              --signal=TERM \
              --kill-after=10s \
              "${RUN_LIMIT}s" \
              env CONCURRENCY="5" \
              node "$TASK_FILE"

            STATUS="$?"

            set -e

            RUN_END="$(date +%s)"
            RUN_SECONDS="$((RUN_END - RUN_START))"

            if (( RUN_SECONDS > LONGEST )); then
              LONGEST="$RUN_SECONDS"
            fi

            echo "Cycle #$COUNT finished in ${RUN_SECONDS}s"
            echo "Status: $STATUS"

            if (( STATUS == 124 || STATUS == 137 )); then
              echo "::error::Time limit reached."
              exit 1
            fi

            if (( STATUS != 0 )); then
              echo "::error::Process failed with status $STATUS."
              exit "$STATUS"
            fi

            WAIT_SECONDS="$(shuf -i 60-120 -n 1)"

            NOW="$(date +%s)"
            REMAINING="$((SAFE_END_TS - NOW))"

            ESTIMATE="$(((LONGEST * 3 + 1) / 2 + 30))"

            if (( ESTIMATE < 180 )); then
              ESTIMATE=180
            fi

            REQUIRED="$((WAIT_SECONDS + ESTIMATE + END_MARGIN))"

            if (( REMAINING <= REQUIRED )); then
              break
            fi

            echo "Pause: ${WAIT_SECONDS}s"
            sleep "$WAIT_SECONDS"
          done

          FINISHED="$(date +%s)"
          ELAPSED="$((FINISHED - START_TS))"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Completed: $COUNT"
          echo "Longest: ${LONGEST}s"
          echo "Elapsed: ${ELAPSED}s"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          {
            echo "## Result"
            echo ""
            echo "- Completed: **$COUNT**"
            echo "- Longest: **${LONGEST}s**"
            echo "- Elapsed: **${ELAPSED}s**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finish
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${TASK_DIR:-}" ]]; then
            rm -rf "$TASK_DIR"
          fi
