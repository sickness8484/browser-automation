name: J1 Routine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1-routine
  cancel-in-progress: false

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"

      CONCURRENCY: "5"

      MAX_QUEST_ADVANCES: "15"
      MAX_QUEST_ITERATIONS: "40"
      MAX_RESCUE_HITS: "30"
      MAX_SAME_QUEST_STATE: "2"

      QUEST_HTTP_ENABLED: "1"
      QUEST_HTTP_FALLBACK_TO_BROWSER: "1"
      RAID_HTTP_ENABLED: "1"
      RAID_HTTP_FALLBACK_TO_BROWSER: "1"

      QUEST_HTTP_TIMEOUT_MS: "15000"
      RAID_HTTP_TIMEOUT_MS: "15000"

      STRICT_EXIT: "0"
      DRY_RUN: "0"
      LOG_LEVEL: "info"

    steps:
      - name: Init
        shell: bash
        run: |
          set -euo pipefail

          START_TS="$(date +%s)"

          # 30分の強制終了より約1分早く内部処理を終了
          SAFE_END_TS="$((START_TS + 1740))"

          echo "START_TS=$START_TS" >> "$GITHUB_ENV"
          echo "SAFE_END_TS=$SAFE_END_TS" >> "$GITHUB_ENV"

      - name: Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Load
        shell: bash
        env:
          J1_DATA: ${{ secrets.J1_RAID_JS }}
        run: |
          set -euo pipefail
          umask 077

          TASK_DIR="$RUNNER_TEMP/j1"
          TASK_FILE="$TASK_DIR/main.cjs"

          rm -rf "$TASK_DIR"
          mkdir -p "$TASK_DIR"
          chmod 700 "$TASK_DIR"

          if [[ -z "${J1_DATA:-}" ]]; then
            echo "::error::Required data is empty."
            exit 1
          fi

          printf '%s' "$J1_DATA" > "$TASK_FILE"
          chmod 600 "$TASK_FILE"

          if [[ ! -s "$TASK_FILE" ]]; then
            echo "::error::Restored data is empty."
            exit 1
          fi

          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "TASK_FILE=$TASK_FILE" >> "$GITHUB_ENV"

          unset J1_DATA

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          'use strict';

          const fs = require('node:fs');

          const file = process.env.TASK_FILE;

          if (!file) {
            throw new Error('TASK_FILE is not defined.');
          }

          let code = fs.readFileSync(file, 'utf8');

          const replacements = [
            [
              'n("CONCURRENCY",2,{min:1,max:4})',
              'n("CONCURRENCY",5,{min:1,max:5})'
            ],
            [
              'n("CONCURRENCY",5,{min:1,max:4})',
              'n("CONCURRENCY",5,{min:1,max:5})'
            ],
            [
              'headless:1',
              'headless:true'
            ],
            [
              'javaScriptEnabled:1',
              'javaScriptEnabled:true'
            ],
            [
              'failOnStatusCode:0',
              'failOnStatusCode:false'
            ],
            [
              'noWaitAfter:1',
              'noWaitAfter:true'
            ],
            [
              'process.env.K',
              'process.env.LOG_LEVEL'
            ]
          ];

          function patchSource(source) {
            let result = source;

            for (const [from, to] of replacements) {
              result = result.replaceAll(from, to);
            }

            return result;
          }

          /*
           * 圧縮ラッパー版の場合、Brotli展開後・実行直前に
           * PATCHED_SOURCEへ修正を加える。
           *
           * これにより先頭に入力した認証URLはそのまま維持される。
           */
          const launchers = [
            'eval(SOURCE);',
            "Function('require', 'process', 'Buffer', SOURCE)(require, process, Buffer);",
            'Function("require","process","Buffer",SOURCE)(require,process,Buffer);'
          ];

          const launcher = launchers.find(value => code.includes(value));

          if (launcher && code.includes('SOURCE')) {
            const runtimeLauncher = launcher.replace(
              /\bSOURCE\b/g,
              'PATCHED_SOURCE'
            );

            const chain = replacements
              .map(
                ([from, to]) =>
                  `  .replaceAll(${JSON.stringify(from)}, ${JSON.stringify(to)})`
              )
              .join('\n');

            const patchBlock = [
              'const PATCHED_SOURCE = SOURCE',
              `${chain};`,
              '',
              runtimeLauncher
            ].join('\n');

            code = code.replace(launcher, patchBlock);
          } else {
            /*
             * 圧縮ラッパーではなく通常のJSが登録されている場合。
             */
            code = patchSource(code);
          }

          fs.writeFileSync(file, code, {
            encoding: 'utf8',
            mode: 0o600
          });

          console.log('Preparation completed.');
          NODE

          cd "$TASK_DIR"

          npm init -y >/dev/null 2>&1

          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            playwright@1.61.0

          npx playwright install --with-deps chromium

      - name: Check
        shell: bash
        run: |
          set -euo pipefail

          test -s "$TASK_FILE"

          # 外側のJSを検査
          node --check "$TASK_FILE"

          # 圧縮本体も展開して、修正後の構文を検査
          node <<'NODE'
          'use strict';

          const fs = require('node:fs');
          const vm = require('node:vm');
          const zlib = require('node:zlib');

          const file = process.env.TASK_FILE;
          const code = fs.readFileSync(file, 'utf8');

          const replacements = [
            [
              'n("CONCURRENCY",2,{min:1,max:4})',
              'n("CONCURRENCY",5,{min:1,max:5})'
            ],
            [
              'n("CONCURRENCY",5,{min:1,max:4})',
              'n("CONCURRENCY",5,{min:1,max:5})'
            ],
            [
              'headless:1',
              'headless:true'
            ],
            [
              'javaScriptEnabled:1',
              'javaScriptEnabled:true'
            ],
            [
              'failOnStatusCode:0',
              'failOnStatusCode:false'
            ],
            [
              'noWaitAfter:1',
              'noWaitAfter:true'
            ],
            [
              'process.env.K',
              'process.env.LOG_LEVEL'
            ]
          ];

          function patchSource(source) {
            let result = source;

            for (const [from, to] of replacements) {
              result = result.replaceAll(from, to);
            }

            return result;
          }

          const payloadMatch = code.match(
            /const\s+PAYLOAD\s*=\s*\[([\s\S]*?)\]\.join\(\s*(['"])\2\s*\)\s*;/
          );

          let source;

          if (payloadMatch) {
            const chunks = vm.runInNewContext(
              `[${payloadMatch[1]}]`,
              Object.create(null),
              {
                timeout: 1000
              }
            );

            if (
              !Array.isArray(chunks) ||
              !chunks.every(value => typeof value === 'string')
            ) {
              throw new Error('Invalid payload format.');
            }

            const payload = chunks.join('');

            source = zlib
              .brotliDecompressSync(
                Buffer.from(payload, 'base64')
              )
              .toString('utf8');
          } else {
            source = code;
          }

          const patched = patchSource(source);

          const invalidPatterns = [
            'headless:1',
            'javaScriptEnabled:1',
            'failOnStatusCode:0',
            'noWaitAfter:1'
          ];

          const leftovers = invalidPatterns.filter(pattern =>
            patched.includes(pattern)
          );

          if (leftovers.length > 0) {
            throw new Error(
              `Invalid options remain: ${leftovers.join(', ')}`
            );
          }

          if (
            patched.includes('n("CONCURRENCY",2,{min:1,max:4})') ||
            patched.includes('n("CONCURRENCY",5,{min:1,max:4})')
          ) {
            throw new Error('Runtime limit was not updated.');
          }

          if (!patched.includes('headless:true')) {
            throw new Error('headless:true was not found.');
          }

          if (
            !patched.includes(
              'n("CONCURRENCY",5,{min:1,max:5})'
            )
          ) {
            throw new Error('Expected runtime marker was not found.');
          }

          new vm.Script(patched, {
            filename: 'payload.cjs'
          });

          console.log('Validation completed.');
          NODE

      - name: Cycle
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0
          LONGEST=0

          # 初回だけ使用する見積もり
          FIRST_ESTIMATE=240

          # 各実行が終了する前に確保する余裕
          END_MARGIN=30

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Started"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          while true; do
            NOW="$(date +%s)"
            REMAINING="$((SAFE_END_TS - NOW))"

            if (( LONGEST > 0 )); then
              # 過去最長時間 + 45秒を次回見積もりに使用
              ESTIMATE="$((LONGEST + 45))"

              # 最低2分は確保
              if (( ESTIMATE < 120 )); then
                ESTIMATE=120
              fi
            else
              ESTIMATE="$FIRST_ESTIMATE"
            fi

            # 次の1回が安全に収まらない場合は開始しない
            if (( REMAINING <= ESTIMATE + END_MARGIN )); then
              break
            fi

            COUNT="$((COUNT + 1))"
            RUN_START="$(date +%s)"

            # 現在の残り時間を超えて動き続けないための絶対上限
            RUN_LIMIT="$((REMAINING - END_MARGIN))"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Cycle #$COUNT"
            echo "Remaining: ${REMAINING}s"
            echo "Limit: ${RUN_LIMIT}s"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            set +e

            timeout \
              --signal=TERM \
              --kill-after=10s \
              "${RUN_LIMIT}s" \
              env CONCURRENCY="5" \
              node "$TASK_FILE"

            STATUS="$?"

            set -e

            RUN_END="$(date +%s)"
            RUN_SECONDS="$((RUN_END - RUN_START))"

            if (( RUN_SECONDS > LONGEST )); then
              LONGEST="$RUN_SECONDS"
            fi

            echo ""
            echo "Cycle #$COUNT finished in ${RUN_SECONDS}s"
            echo "Status: $STATUS"

            if (( STATUS == 124 || STATUS == 137 )); then
              echo "::error::Time limit reached."
              exit 1
            fi

            if (( STATUS != 0 )); then
              echo "::error::Process failed with status $STATUS."
              exit "$STATUS"
            fi

            # 次回まで60～120秒のランダム待機
            WAIT_SECONDS="$(shuf -i 60-120 -n 1)"

            NOW="$(date +%s)"
            REMAINING="$((SAFE_END_TS - NOW))"

            ESTIMATE="$((LONGEST + 45))"

            if (( ESTIMATE < 120 )); then
              ESTIMATE=120
            fi

            REQUIRED="$((WAIT_SECONDS + ESTIMATE + END_MARGIN))"

            # 待機時間と次回処理時間の両方が収まらなければ終了
            if (( REMAINING <= REQUIRED )); then
              break
            fi

            echo "Pause: ${WAIT_SECONDS}s"

            sleep "$WAIT_SECONDS"
          done

          FINISHED="$(date +%s)"
          ELAPSED="$((FINISHED - START_TS))"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Completed: $COUNT"
          echo "Longest: ${LONGEST}s"
          echo "Elapsed: ${ELAPSED}s"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          {
            echo "## Result"
            echo ""
            echo "- Completed: **$COUNT**"
            echo "- Longest: **${LONGEST}s**"
            echo "- Elapsed: **${ELAPSED}s**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finish
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${TASK_DIR:-}" ]]; then
            rm -rf "$TASK_DIR"
          fi

          echo "Finished."
