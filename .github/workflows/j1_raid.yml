name: J1 Raid Economy v7.6

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1-raid-economy
  cancel-in-progress: false

env:
  NODE_ENV: production

  # 認証URLは6件。異なるアカウント・異なるレイドは最大6並列。
  # 同じ物理レイドへの攻撃だけは、JS内部のraid mutexで直列化する。
  CONCURRENCY: 6

  # JS内部は23分、外側timeoutは24分、ジョブ全体は30分。
  RUN_BUDGET_MS: 1380000

  # イベント駆動スケジューラ。
  OWN_CHECK_INTERVAL_SEC: 90
  QUEST_RETRY_SEC: 120
  IDLE_POLL_MAX_SEC: 30
  SUMMARY_INTERVAL_SEC: 300

  # 無料攻撃の状態管理。
  FREE_VERIFY_FIRST_SEC: 30
  FREE_RETRY_AFTER_SEC: 90
  FREE_VERIFY_AFTER_RETRY_SEC: 30
  FREE_MAX_SUBMISSIONS: 2
  FREE_STATE_TTL_SEC: 7200

  # 同一物理レイドへの攻撃競合防止。
  RAID_ATTACK_LOCK_WAIT_WARN_MS: 1500

  # v7.6: lock取得後の最新readyに攻撃フォームが出ない場合の再確認間隔。
  # canonical ready再取得と、同一レイドと確認できた元フォームへの復旧を先に試す。
  FORM_MISSING_RETRY_SEC: 120

  # 管理アカウントの攻撃直後のHP減少を、外部DPSへ混ぜない。
  MANAGED_ACTION_SUPPRESS_SEC: 30
  EXTERNAL_DPS_MIN_SAMPLE_SEC: 5
  EXTERNAL_DPS_MAX_GAP_SEC: 900

  # 残り時間が少ない管理自発・管理救援を優先する。
  OWN_TIMEOUT_PRESSURE_SEC: 600
  MANAGED_RESCUE_TIMEOUT_PRESSURE_SEC: 300

  # コンボは前回攻撃から10分。
  COMBO_WINDOW_SEC: 600
  OWN_COMBO_MIN: 10
  RESCUE_COMBO_MIN: 15
  OWN_PROTECT_10_14_SEC: 480
  OWN_PROTECT_15_29_SEC: 465
  OWN_PROTECT_30_PLUS_SEC: 450
  RESCUE_PROTECT_SEC: 480
  COMBO_LOCK_MS: 45000
  COMBO_RECHECK_FLOOR_SEC: 60

  # 実測では第1波が最多、第3波は13分付近でほぼ空だったため11分へ前倒し。
  # 新規自発: 3分・7分・11分。起動時に既存: 30秒・5分・10分。
  RESCUE_WAVE_OFFSETS_SEC: 180,420,660
  RESCUE_EXISTING_WAVE_OFFSETS_SEC: 30,300,600
  MAX_RESCUE_LIST_LOADS: 3
  MAX_RESCUES_PER_WAVE: 12
  RESCUE_CACHE_TTL_SEC: 7200

  # BP・火力判断。管理自発を最優先する。
  BP_OVERFLOW_MARGIN: 3
  MAX_OWN_PAID_HITS_PER_CYCLE: 3
  MAX_EXTERNAL_RESCUE_PAID_PER_RUN: 2
  DEFAULT_NORMAL_DAMAGE: 500000
  DEFAULT_FULL_RATIO_X100: 280
  FINISH_SAFETY_X100: 120

  # デッキ・計測。
  DECK_AUTO_SWITCH: 'true'
  DECK_SCAN_MAX: 12
  MEASURE_ENABLED: 'true'
  MEASURE_LOG_PATH: ${{ github.workspace }}/raid_measurements.jsonl

  # 12回以上攻撃要求があるのにPOSTが0回、または認証済みアカウントが0件なら失敗扱い。
  # 単発の判定保留では失敗にしない。
  STRICT_EXIT_V7: 'true'

jobs:
  raid-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show runtime versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            npm init -y >/dev/null 2>&1
          fi

          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Create J1 raid script
        shell: bash
        env:
          RAID_SCRIPT_SOURCE: ${{ secrets.j1_raid_js }}
        run: |
          set -euo pipefail

          SCRIPT_FILE="j1_raid.js"

          if [ -z "${RAID_SCRIPT_SOURCE:-}" ]; then
            echo "::error::Secret j1_raid_js が未設定、または空です。"
            exit 1
          fi

          printf '%s' "$RAID_SCRIPT_SOURCE" > "$SCRIPT_FILE"
          FILE_SIZE="$(wc -c < "$SCRIPT_FILE")"

          echo "Script created: $SCRIPT_FILE"
          echo "Script size   : $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 15000 ]; then
            echo "::error::生成されたJSが小さすぎます。Secretへの貼り付けが途中で切れている可能性があります。"
            exit 1
          fi

          if [ "$FILE_SIZE" -ge 49152 ]; then
            echo "::error::JSがGitHub Secretの48 KiB上限以上です。Compact版を使用してください。"
            exit 1
          fi

          node --check "$SCRIPT_FILE"
          echo "JavaScript syntax check passed."

      - name: Run v7.6 parser, form recovery, state and mutex self-test
        shell: bash
        env:
          V7_SELF_TEST_ONLY: '1'
          ALLOW_DUMMY_AUTH: '1'
          MEASURE_ENABLED: 'false'
        run: |
          set -euo pipefail
          node --unhandled-rejections=strict j1_raid.js

      - name: Initialize measurement file
        shell: bash
        run: |
          set -euo pipefail
          : > "$MEASURE_LOG_PATH"

      - name: Run J1 raid script
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_FILE="j1_raid.js"

          echo "========================================"
          echo "J1 Raid Economy v7.6"
          echo "Node               : $(node --version)"
          echo "Account concurrency: ${CONCURRENCY}"
          echo "Raid attack policy : same raid serialized"
          echo "Form recovery      : canonical ready + verified fallback"
          echo "Internal budget    : $((RUN_BUDGET_MS / 60000)) minutes"
          echo "External limit     : 24 minutes"
          echo "Idle page policy   : pages closed; contexts retained"
          echo "Rescue waves       : ${RESCUE_WAVE_OFFSETS_SEC}"
          echo "Started at         : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "========================================"

          set +e
          timeout \
            --signal=TERM \
            --kill-after=60s \
            24m \
            node \
              --unhandled-rejections=strict \
              "$SCRIPT_FILE"
          EXIT_CODE=$?
          set -e

          echo "========================================"
          echo "Finished at : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Exit code   : ${EXIT_CODE}"
          echo "========================================"

          case "$EXIT_CODE" in
            0)
              echo "J1 raid script completed successfully."
              ;;
            124)
              echo "::notice::24分の外部タイムアウトに到達したため終了しました。"
              exit 0
              ;;
            143)
              echo "::notice::TERMシグナルによって正常停止しました。"
              exit 0
              ;;
            137)
              echo "::error::60秒の終了猶予後も停止できず、強制終了されました。"
              exit 137
              ;;
            *)
              echo "::error::スクリプトがエラー終了しました。終了コード: ${EXIT_CODE}"
              exit "$EXIT_CODE"
              ;;
          esac

      - name: Show measurement summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$MEASURE_LOG_PATH" ]; then
            echo "Measurement file is empty."
            exit 0
          fi

          echo "Measurement lines: $(wc -l < "$MEASURE_LOG_PATH")"
          echo "Measurement bytes: $(wc -c < "$MEASURE_LOG_PATH")"
          echo "----- Last 100 records -----"
          tail -n 100 "$MEASURE_LOG_PATH"

      - name: Upload raid measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raid-measurements-v7-6-${{ github.run_id }}
          path: raid_measurements.jsonl
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
