name: "Task B"

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: R1
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: R2
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: R3
        uses: actions/cache@v4
        with:
          path: .task-state
          key: task-b-${{ github.ref_name }}
          restore-keys: |
            task-b-

      - name: R4
        shell: bash
        env:
          BUNDLE: ${{ secrets.G9_RAID_JS }}
        run: |
          if [ -z "${BUNDLE:-}" ]; then
            echo "::error::Input unavailable."
            exit 1
          fi
          printf '%s' "$BUNDLE" > task.js
          node --check task.js
          CHECK_ONLY=1 node task.js > .check
          grep -q 'SELF_TEST_OK_' .check
          rm -f .check

      - name: R5
        shell: bash
        env:
          CONCURRENCY: '6'
          RUN_BUDGET_MS: '1560000'
          PROD_LOG: '1'
          MEASURE_ENABLED: '0'
          LOG_LEVEL: "error"
        run: |
          timeout --signal=TERM --kill-after=20s 28m node task.js
