        run: |
          set -Eeuo pipefail
          umask 077
          node <<'RESTORE'
          'use strict';
          // Public bootstrap: no account data, provider names or plaintext task program.
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),z=require('node:zlib'),vm=require('node:vm');
          const fail=code=>{throw Object.assign(new Error(code),{safeCode:code})};
          const hash=x=>crypto.createHash('sha256').update(x).digest('hex');
          const decode=s=>{if(typeof s!=='string'||!s.length||s.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(s))fail('INPUT_BASE64_INVALID');const b=Buffer.from(s,'base64');if(b.toString('base64')!==s)fail('INPUT_BASE64_INVALID');return b};
          const object=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
          const clean=value=>{if(typeof value!=='string'||!value.trim())fail('INPUT_SECRET_MISSING');if(Buffer.byteLength(value)>131072)fail('INPUT_SECRET_OVERSIZED');const text=value.replace(/\s/g,'');if(Buffer.byteLength(text)>=49152)fail('INPUT_SECRET_OVERSIZED');return text};
          let stage=null,key=null,plain=null;
          try{
           const text=clean(process.env.INPUT_SECRET);delete process.env.INPUT_SECRET;
           const m=/^TIN1\.([a-f0-9]{64})\.([A-Za-z0-9+/=]+)$/.exec(text);if(!m)fail('INPUT_SECRET_FORMAT_INVALID');
           let data;try{data=z.gunzipSync(decode(m[2]),{maxOutputLength:2097152})}catch(e){if(e.safeCode)throw e;fail('INPUT_SECRET_DECODE_FAILED')}
           if(hash(data)!==m[1])fail('INPUT_SECRET_HASH_MISMATCH');
           let capsule;try{capsule=JSON.parse(data.toString('utf8'))}catch{fail('INPUT_SECRET_JSON_INVALID')}
           if(!object(capsule)||capsule.format!==1||!object(capsule.settings))fail('INPUT_SECRET_SCHEMA_INVALID');
           const cfg=capsule.settings;
           if(cfg.schema!==3||cfg.edition!=='single'||typeof cfg.build!=='string')fail('INPUT_SETTINGS_INVALID');
           const encoded=(process.env.INPUT_PACKAGE||'').replace(/\s/g,'');if(encoded.length>1000000)fail('INPUT_PACKAGE_OVERSIZED');
           const payload=decode(encoded),expected=process.env.INPUT_PACKAGE_HASH;
           if(!/^[a-f0-9]{64}$/.test(expected||'')||hash(payload)!==expected)fail('INPUT_PACKAGE_HASH_MISMATCH');
           if(capsule.packageHash!==expected)fail('INPUT_PACKAGE_PAIR_MISMATCH');
           if(payload.length<33||payload.subarray(0,4).toString('ascii')!=='TPB1')fail('INPUT_PACKAGE_FORMAT_INVALID');
           key=decode(capsule.key);if(key.length!==32)fail('INPUT_KEY_INVALID');
           try{const d=crypto.createDecipheriv('aes-256-gcm',key,payload.subarray(4,16),{authTagLength:16});d.setAAD(Buffer.from('task-payload-v1','ascii'));d.setAuthTag(payload.subarray(16,32));plain=Buffer.concat([d.update(payload.subarray(32)),d.final()]);}catch{fail('INPUT_PACKAGE_AUTH_FAILED')}
           if(hash(plain)!==capsule.archiveHash)fail('INPUT_ARCHIVE_HASH_MISMATCH');
           let pkg;try{pkg=JSON.parse(z.brotliDecompressSync(plain,{maxOutputLength:16777216}).toString('utf8'))}catch{fail('INPUT_ARCHIVE_INVALID')}
           if(!object(pkg)||pkg.schema!==3||pkg.build!==cfg.build)fail('INPUT_BUILD_MISMATCH');
           const files=['native-core.js','task-entry.cjs','selftest.cjs'];
           if(!object(pkg.files)||Object.keys(pkg.files).length!==files.length||Object.keys(pkg.files).some(n=>!files.includes(n)))fail('INPUT_FILES_INVALID');
           for(const name of files){const f=pkg.files[name];if(!object(f)||typeof f.content!=='string'||hash(f.content)!==f.sha256)fail('INPUT_FILE_HASH_MISMATCH');try{new vm.Script(f.content,{filename:name})}catch{fail('INPUT_FILE_SYNTAX_INVALID')}}
           const root=process.env.TASK_DIR,parent=process.env.RUNNER_TEMP;
           if(!root||!parent||!path.isAbsolute(root)||!path.isAbsolute(parent)||path.resolve(root)!==path.join(path.resolve(parent),'task-input'))fail('INPUT_DIRECTORY_INVALID');
           if(!fs.statSync(parent).isDirectory()||fs.existsSync(root))fail('INPUT_DIRECTORY_NOT_EMPTY');
           stage=fs.mkdtempSync(path.join(path.resolve(parent),'.task-stage-'));fs.chmodSync(stage,0o700);
           for(const name of files)fs.writeFileSync(path.join(stage,name),pkg.files[name].content,{mode:0o600,flag:'wx'});
           fs.writeFileSync(path.join(stage,'settings.json'),JSON.stringify(cfg),{mode:0o600,flag:'wx'});
           fs.renameSync(stage,root);stage=null;
           data.fill(0);console.log('INPUT_RESTORE_OK');
          }catch(e){console.error(e.safeCode||'INPUT_RESTORE_FAILED');process.exitCode=1;}
          finally{key?.fill(0);plain?.fill(0);delete process.env.INPUT_SECRET;if(stage)try{fs.rmSync(stage,{recursive:true,force:true})}catch{}}
          RESTORE
      - name: Verify input
        shell: bash
        run: |
          set -Eeuo pipefail
          node "$TASK_DIR/task-entry.cjs" verify
      - name: Prepare runtime
        if: inputs.mode != 'verify'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$TASK_DIR"
          npm install --no-audit --no-fund --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Execute
        if: inputs.mode != 'verify'
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          node "$TASK_DIR/task-entry.cjs" "$INPUT_MODE"
      - name: Collect results
        if: always() && inputs.mode != 'verify'
        uses: actions/upload-artifact@v4
        with:
          name: task-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/task-input/evidence/*.bin
            ${{ runner.temp }}/task-input/evidence/safe-summary.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Clear temporary inputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TASK_DIR" == "$RUNNER_TEMP/task-input" ]]; then
            rm -rf -- "$TASK_DIR"
          fi
