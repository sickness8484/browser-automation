name: Automation
on:
  workflow_dispatch:
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium
      - name: Run automation scripts
        env:
          COUNT_JS: ${{ secrets.COUNT_JS }}
        run: |
          echo "$COUNT_JS" > count_js
          
          # ── 事前実行 ─────────────────────────
          echo "Running COUNT_JS..."
          node count_js
          
          echo "All done!"
      - name: Cleanup
        if: always()
        run: |
          rm -f count_js
