name: Automation
on:
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium

      - name: Run automation scripts
        env:
          GOLD_SHINKOU_JS: ${{ secrets.GOLD_SHINKOU_JS }}
          GOLD_KYUEN_JS: ${{ secrets.GOLD_KYUEN_JS }}
        run: |
          # GOLD_SHINKOU_JS を実行
          echo "Running GOLD_SHINKOU_JS..."
          echo "$GOLD_SHINKOU_JS" > gold_shinkou.js
          node gold_shinkou.js
          
          # 5回のループ
          for i in {1..5}; do
            echo "=== Cycle $i/5 ==="
            
            # 3〜4分のランダム待機
            WAIT_TIME=$((180 + RANDOM % 61))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            
            # GOLD_KYUEN_JS を実行
            echo "Running GOLD_KYUEN_JS (1st time in cycle $i)..."
            echo "$GOLD_KYUEN_JS" > gold_kyuen.js
            node gold_kyuen.js
            
            # 3〜4分のランダム待機
            WAIT_TIME=$((180 + RANDOM % 61))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            
            # GOLD_KYUEN_JS を再度実行
            echo "Running GOLD_KYUEN_JS (2nd time in cycle $i)..."
            node gold_kyuen.js
          done
          
          echo "All cycles completed!"

      - name: Cleanup
        if: always()
        run: |
          rm -f gold_shinkou.js gold_kyuen.js
