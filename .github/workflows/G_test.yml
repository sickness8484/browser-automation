name: Browser Task v8.0.5 r3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-task-v8-0-5
  cancel-in-progress: false

env:
  NODE_ENV: production
  NODE_OPTIONS: --max-old-space-size=2048
  MEASURE_ENABLED: 'true'
  MEASURE_LOG_PATH: ${{ github.workspace }}/task_metrics.jsonl

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Setup runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          npm init -y >/dev/null 2>&1
          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            playwright

          VERSION="$(node -p 'require("playwright/package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-runtime-${{ steps.package.outputs.version }}-chromium

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Prepare task
        shell: bash
        env:
          TASK_SOURCE: ${{ secrets.G1_RAID_JS }}
        run: |
          set -euo pipefail

          TASK_FILE="task.js"

          if [ -z "${TASK_SOURCE:-}" ]; then
            echo "::error::Required configuration is missing."
            exit 1
          fi

          printf '%s' "$TASK_SOURCE" > "$TASK_FILE"

          FILE_SIZE="$(wc -c < "$TASK_FILE")"
          echo "Task prepared. bytes=$FILE_SIZE"

          if [ "$FILE_SIZE" -lt 5000 ] || [ "$FILE_SIZE" -ge 49152 ]; then
            echo "::error::Configuration size is outside the allowed range."
            exit 1
          fi

          node --check "$TASK_FILE"

          node <<'NODE'
          'use strict';

          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const zlib = require('node:zlib');

          const EXPECTED_PAYLOAD_SHA256 =
            'ce86499977ee05879aa53e260afc2deed03be97e5dae2110c64d9474e6785af5';

          const wrapper = fs.readFileSync('task.js', 'utf8');
          const payload = wrapper.match(/const\s+PAYLOAD\s*=\s*['"]([^'"]+)['"]/s)?.[1];

          if (!payload) {
            throw new Error('Payload was not found.');
          }

          const compressed = Buffer.from(payload, 'base64');
          const digest = crypto
            .createHash('sha256')
            .update(compressed)
            .digest('hex');

          if (digest !== EXPECTED_PAYLOAD_SHA256) {
            throw new Error('Payload version mismatch.');
          }

          const source = zlib.brotliDecompressSync(compressed).toString('utf8');
          new Function(source);

          const prefix = wrapper.slice(0, wrapper.indexOf('const PAYLOAD'));
          const itemCount = (prefix.match(/https:\/\//g) || []).length;

          if (itemCount !== 6 || /DUMMY/i.test(prefix)) {
            throw new Error('Configuration items are incomplete.');
          }

          console.log('Payload validation passed.');
          NODE

          if ! SELF_TEST_OUTPUT="$(SELF_TEST=1 node "$TASK_FILE" 2>&1)"; then
            echo "::error::Task self-test failed."
            exit 1
          fi

          echo "Task self-test passed."

      - name: Execute task
        id: execute-task
        shell: bash
        run: |
          set -uo pipefail

          echo "Task started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          timeout \
            --signal=TERM \
            --kill-after=60s \
            28m \
            node task.js \
            > task_output.log \
            2>&1

          CODE=$?

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Task finished at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo "::error::Task execution failed. See the output artifact."
          fi

          exit "$CODE"

      - name: Write summary
        if: always()
        shell: bash
        env:
          TASK_OUTCOME: ${{ steps.execute-task.outcome }}
          TASK_CODE: ${{ steps.execute-task.outputs.code }}
        run: |
          set -euo pipefail

          {
            echo "## Browser Task v8.0.5 r3"
            echo
            echo "- Outcome: ${TASK_OUTCOME:-unknown}"
            echo "- Exit code: ${TASK_CODE:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package output
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          files=()

          for file in task_output.log task_metrics.jsonl; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            printf '%s\n' 'No task output was generated.' > task_status.txt
            files+=(task_status.txt)
          fi

          tar -czf task_output.tar.gz "${files[@]}"
          echo "Output package prepared."

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: task_output.tar.gz
          if-no-files-found: warn
          retention-days: 7
