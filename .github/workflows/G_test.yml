name: Automation
on:
  workflow_dispatch:
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install --with-deps chromium
      - name: Run automation scripts
        env:
          G1_TEST_JS: ${{ secrets.G1_TEST_JS }}
          G1_KYUEN_JS: ${{ secrets.G1_KYUEN_JS }}
        run: |
          set +e
          run_node_safe() {
            local label="$1"
            local file="$2"
            echo "Running ${label}..."
            node "$file"
            local code=$?
            if [ "$code" -ne 0 ]; then
              echo "::warning title=${label} failed::exit code ${code}"
            fi
            return 0
          }
          
          printf '%s\n' "$G1_TEST_JS" > g1_test.js
          printf '%s\n' "$G1_KYUEN_JS" > g1_kyuen.js
          
          # ── 事前実行 ─────────────────────────
          run_node_safe G1_TEST_JS g1_test.js
          
          # ── 繰り返し実行: 7回 ─────────────────────────
          for i in {1..7}; do
            echo "=== Repeat $i/7 ==="
            
            WAIT_TIME=$((90 + RANDOM % 30))
            echo "Waiting ${WAIT_TIME} seconds..."
            sleep $WAIT_TIME
            
            run_node_safe G1_KYUEN_JS g1_kyuen.js
          done
          
          echo "All done!"
      - name: Cleanup
        if: always()
        run: |
          rm -f g1_test.js g1_kyuen.js
