name: Daily Test

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm init -y && npm install playwright

      - run: npx playwright install --with-deps

      - env:
          G4_RAID_JS: ${{ secrets.G4_RAID_JS }}
        run: |
          printf '%s\n' "$G4_RAID_JS" > g4_raid.js
          node g4_raid.js
