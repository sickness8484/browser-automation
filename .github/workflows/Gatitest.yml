name: DC ガチ聖戦 v2.16（5 Secrets・崇拝担当固定）
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: verify=復元検証のみ / battle=実戦を開始
        type: choice
        options:
        - verify
        - battle
        default: verify
        required: true
permissions:
  contents: read
concurrency:
  group: dc-holywar-single-owner
  cancel-in-progress: false
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYNC_DIR: ${{ github.workspace }}/.runtime-sync
      HW_ULTIMATE_CACHE_DIR: ${{ github.workspace }}/.task-state/runtime-cache
      HW_ULTIMATE_CACHE_MAX_AGE_MS: '1209600000'
      HW_EMBEDDED_INVENTORY_MAX_AGE_MS: '7776000000'
      HW_HISTORICAL_SEED_MAX_AGE_MS: '7776000000'
      HW_SHARED_ENEMY_CACHE_MS: '450'
      HW_ADAPTIVE_DEBUFF_STOP_RATIO: '0.62'
      HW_ADAPTIVE_DEBUFF_MIN_SATURATED: '4'
      HW_SCRIPT_DIR: ${{ github.workspace }}/scripts
      HW_RELEASE_ID: DC_v2_16_0_WORSHIP_ALIGNMENT_RC1
      HW_DATA_VERSION: M&T@2026-09-05T11:27:33.455Z
      HW_POLL_MS: '520'
      HW_RUNTIME_MS: '1920000'
      HW_CHAIN_TIMEOUT_MS: '1920000'
      HW_RAPHA_MIN_AFFECTED: '3'
      HW_RAPHA_OFFENSE_LOSS: '0.18'
      HW_RAPHA_DEFENSE_LOSS: '0.22'
      HW_RAPHA_COOLDOWN_MS: '4200'
      HW_RAPHA_ALLOW_WORSHIP: '0'
      HW_RAPHA_ALLOW_SOUL: '0'
      HW_RAPHA_ALLOW_PURGATORY: '0'
      HW_RAPHA_ALLOW_HATRED: '1'
      HW_RAPHA_ALLOW_AZURE: '1'
      HW_PHYSICAL_BARRIER_MAX_WAIT_MS: '5200'
      HW_PURG1_FUMES_MIN_RESERVE: '1'
      HW_PURG2_FUMES_PREP_LIMIT: '16'
      HW_ENEMY_INTEL_TTL_MS: '18000'
      HW_SUPERBUFF_COUNTER_WINDOW_MS: '14000'
      HW_SUPERBUFF_MAX_RESPONSES: '3'
      HW_SUPERBUFF_ADRA_GRACE_MS: '1200'
      HW_SUPERBUFF_CHAIN_GAP_MS: '440'
      HW_SUPERBUFF_FASTLANE_MAX_LOCAL_WAIT_MS: '650'
      HW_SUPERBUFF_CLUSTER_MS: '2600'
      HW_RAPHA_ENEMY_BURST_LOOKAHEAD_S: '12'
      HW_RAPHA_SEVERE_LOSS: '0.30'
      HW_QUETZ_EV_GO: '500000000'
      HW_QUETZ_EV_RELATIVE: '1.25'
      HW_QUETZ_URGENT_SECONDS: '10'
      HW_QUETZ_REAR_URGENT_SECONDS: '15'
      HW_PAYLOAD_RESERVE_LEAD_SEC: '12'
      HW_AZURE_SETUP_LEAD_SEC: '30'
      HW_MIX_JOB_STALE_MS: '1800'
      HW_RECOVER_FAIL_BASE_BACKOFF_MS: '8000'
      HW_RECOVER_FAIL_MAX_BACKOFF_MS: '60000'
      HW_ATTACKER_BURST_JIT: '1'
      HW_ATTACKER_BURST_JIT_ACTIONS: '3'
      HW_ATTACKER_BURST_JIT_MIN_SEC: '28'
      HW_ATTACKER_BURST_JIT_THREE_ACTION_SEC: '45'
      HW_FUTURE_PAYLOAD_HIGH_COEFF: '96'
      HW_GABRIEL_RELAY_LIMIT: '3'
      HW_DAMAGE_MODEL: continuous
      HW_COMBO_OVER1600_SLOPE: '0.0625'
      HW_MELLOW_STRIP_WINDOW_MS: '22000'
      HW_MELLOW_STRIP_LIMIT: '10'
      HW_MELLOW_MIN_LEVEL: '17'
      HW_MELLOW_ROTATION_SHOTS: '3'
      HW_MELLOW_REAR_DELAY_MS: '6000'
      HW_HYDRA_NEAR_LIMIT: '64'
      HW_HYDRA_REMOTE_LIMIT: '64'
      HW_HYDRA_MIN_LEVEL: '1'
      HW_HYDRA_MIN_SECONDS_LEFT: '10'
      HW_HYDRA_REMOTE_INTERLEAVE_MS: '1100'
      HW_HYDRA_REMOTE_FLUSH_SECONDS: '12'
      HW_QUETZ_DROP_RESERVE_WP: '50'
      HW_GABRIEL_MIN_ACTIVE_MS: '1600'
      HW_GABRIEL_SEVERE_ACTIVE_MS: '2200'
      HW_ENEMY_AZURE_WALL_CADENCE_MS: '650'
      HW_GABRIEL_MIN_DYING: '5'
      HW_POSITION_COOLDOWN_MS: '6500'
      HW_POSITION_LEASE_MS: '14000'
      HW_REVIVE_PUNISH_WINDOW_MS: '7000'
      HW_ENEMY_CARRY_REENTRY_WINDOW_MS: '45000'
      HW_ENEMY_CARRY_REENTRY_MAX_STAGES: '3'
      HW_MAINTENANCE_WP_RESERVE: '60'
      HW_SPECIAL_SWAP_TO_NONWALL: '0'
      HW_ENEMY_AZURE_PRE_ADRA_SECONDS: '3'
      HW_ENEMY_AZURE_PRE_ADRA_CAP: '4'
      HW_ENEMY_AZURE_REBUFF_ADRA_CAP: '4'
      HW_ENEMY_AZURE_ADRA_BURST_WINDOW_MS: '2800'
      HW_AZURE_PRE_CLOUD_DEBUFF_CAP: '4'
      HW_ENEMY_ULT_BOARD_REPORT: '1'
      HW_STRICT_PHASE_FAILURES: '0'
      HW_STRICT_FINAL: '0'
      HW_COUNTERPLAY_RELEASE: 2.14.0-continuous-mix-rc1
      HW_CONTINUOUS_MIX_RELEASE: 2.14.0-continuous-mix-rc1
      HW_COUNTERPLAY_SNAPSHOT: '2026-09-05T11:27:33.455Z'
      HW_RECOVER_MAX_STEPS: '4'
      HW_RECOVER_BUDGET_MS: '8000'
    steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned browser runtime
      shell: bash
      run: |-
        set -Eeuo pipefail
        npm init -y >/dev/null
        npm install --no-save --ignore-scripts playwright@1.57.0
        npx playwright install --with-deps chromium
    - name: Restore and verify five Secrets
      id: restore
      shell: bash
      env:
        HW_PACKAGE_01: ${{ secrets.HW_PACKAGE_01 }}
        HW_PACKAGE_02: ${{ secrets.HW_PACKAGE_02 }}
        HW_PACKAGE_03: ${{ secrets.HW_PACKAGE_03 }}
        HW_PACKAGE_04: ${{ secrets.HW_PACKAGE_04 }}
        HW_SETTINGS: ${{ secrets.HW_SETTINGS }}
      run: |
        set -Eeuo pipefail
        umask 077
        mkdir -p logs .runtime-sync .runtime-debug
        trap 'rm -rf .runtime-secret' EXIT
        python3 - <<'PY_RESTORE'
        import os,base64,gzip,json,hashlib,tarfile,io,pathlib
        EXPECTED='4e22a1a54589890f8b2c6ed3991e0538c90547df008c1f657ba0baf864c666ee'
        ALLOW=set(['phase_supervisor.js', 'preflight_roster.js', 'scripts/continuous_mixed_v214.js', 'scripts/counterplay_v213.js', 'scripts/front_skill_policy_v214.js', 'scripts/holywar_engine_v299.js', 'scripts/holywar_policy_v299.js', 'scripts/release_gate.js', 'scripts/restore_settings.js', 'scripts/worship_assignment_v216.js', 'tests/continuous_mixed_offense.js', 'tests/counterplay_addendum.js', 'tests/handoff_counterexamples.js', 'tests/log_audit_v215.js', 'tests/runtime_regression.js', 'tests/ssot_regression.js', 'tests/worship_alignment_v216.js'])
        parts=[]
        for n in range(1,5):
         key=f'HW_PACKAGE_{n:02d}';s=os.environ.get(key,'')
         if not s or len(s.encode())>=49152: raise SystemExit('Missing or oversized '+key)
         parts.append(s.strip())
        try: data=base64.b64decode(''.join(parts),validate=True)
        except Exception: raise SystemExit('PACKAGE_BASE64_INVALID')
        if hashlib.sha256(data).hexdigest()!=EXPECTED: raise SystemExit('PACKAGE_INTEGRITY_MISMATCH: copy all four parts from the same editor')
        secret=os.environ.get('HW_SETTINGS','')
        if not secret.startswith('HWSET1:') or len(secret.encode())>=49152: raise SystemExit('SETTINGS_MISSING_OR_OVERSIZED')
        try:
         payload=gzip.decompress(base64.b64decode(secret[7:],validate=True))
         if len(payload)>4000000: raise ValueError()
         cfg=json.loads(payload)
        except Exception: raise SystemExit('SETTINGS_DECODE_FAILED')
        if cfg.get('coreSha256')!=EXPECTED or cfg.get('schema') not in ('dc-hw-settings-v1','dc-hw-settings-v2'): raise SystemExit('PACKAGE_SETTINGS_VERSION_MISMATCH')
        with tarfile.open(fileobj=io.BytesIO(data),mode='r:xz') as t:
         members=t.getmembers()
         if len(members)!=len(ALLOW) or {m.name for m in members}!=ALLOW or any(not m.isfile() for m in members): raise SystemExit('PACKAGE_LAYOUT_MISMATCH')
         for m in members:
          p=pathlib.Path(m.name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(t.extractfile(m).read());p.chmod(0o600)
        pathlib.Path('.runtime-secret').mkdir(exist_ok=True,mode=0o700)
        p=pathlib.Path('.runtime-secret/settings.json');p.write_bytes(payload);p.chmod(0o600)
        # Mask derived credential fragments before any runtime diagnostic output.
        if os.environ.get('GITHUB_ACTIONS')=='true':
         from urllib.parse import urlparse,parse_qs
         tokens=set()
         urls=[x[0] for x in cfg['tables']['accounts']] if cfg.get('schema')=='dc-hw-settings-v2' else [url for r in cfg.get('roles',[]) for url in r['auth'][0]]
         for url in urls:
          tokens.add(url)
          for k,values in parse_qs(urlparse(url).query).items():
           if k in ('e','key','c'): tokens.update(values)
         for s in sorted(tokens):
          if s: print('::add-mask::'+s)
        print('Package hash/layout and settings version verified.')

        PY_RESTORE
        export HW_EXPECTED_CORE_SHA='4e22a1a54589890f8b2c6ed3991e0538c90547df008c1f657ba0baf864c666ee'
        node scripts/restore_settings.js .runtime-secret/settings.json
        for f in scripts/*.js tests/*.js preflight_roster.js phase_supervisor.js; do node --check "$f" >/dev/null 2>&1 || { echo "Syntax check failed: $(basename "$f") (source suppressed)"; exit 1; }; done
        node scripts/release_gate.js
        HW_TEST_MODE=1 node tests/continuous_mixed_offense.js
        HW_TEST_MODE=1 node tests/ssot_regression.js
        HW_TEST_MODE=1 node tests/log_audit_v215.js
        HW_TEST_MODE=1 node tests/runtime_regression.js
        HW_TEST_MODE=1 node tests/counterplay_addendum.js
        HW_TEST_MODE=1 node tests/worship_alignment_v216.js
        HW_TEST_MODE=1 node tests/handoff_counterexamples.js
    - name: Restore inventory cache
      if: ${{ inputs.mode == 'battle' }}
      uses: actions/cache/restore@v4
      with:
        path: .task-state/runtime-cache
        key: dc-inventory-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: dc-inventory-${{ github.ref_name }}-
    - name: Live identity and ultimate preflight
      id: preflight
      if: ${{ inputs.mode == 'battle' }}
      shell: bash
      run: |-
        set -Eeuo pipefail
        node preflight_roster.js 2>&1 | tee logs/preflight.log
        test -f .runtime-sync/hw.global.resource_plan
    - name: Save inventory cache
      if: ${{ inputs.mode == 'battle' && steps.preflight.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: .task-state/runtime-cache
        key: dc-inventory-${{ github.ref_name }}-${{ github.run_id }}
    - name: Execute 30-minute battle controller
      if: ${{ inputs.mode == 'battle' && steps.preflight.outcome == 'success' }}
      shell: bash
      run: |-
        set -Eeuo pipefail
        node phase_supervisor.js 2>&1 | tee logs/supervisor.log
    - name: Prepare sanitized diagnostics
      if: always()
      shell: bash
      run: |-
        set -Eeuo pipefail
        python3 - <<'PY_LOG'
        from pathlib import Path
        import re,json,base64
        from urllib.parse import urlparse,parse_qs
        values=set()
        for p in Path('scripts').glob('*_attacker.js'):
         try:
          b=re.search(r"__HW_AUTH_PACK__='([^']+)'",p.read_text())[1]
          for u in json.loads(base64.b64decode(b))[0]:
           values.add(u)
           for k,v in parse_qs(urlparse(u).query).items():
            if k in ['e','key','c']:values.update(v)
         except Exception:pass
        for p in Path('scripts').glob('*_wall.js'):
         try:
          b=re.search(r"__HW_AUTH_PACK__='([^']+)'",p.read_text())[1]
          for u in json.loads(base64.b64decode(b))[0]:
           values.add(u)
           for k,v in parse_qs(urlparse(u).query).items():
            if k in ['e','key','c']:values.update(v)
         except Exception:pass
        out=Path('logs-sanitized');out.mkdir(exist_ok=True)
        for p in Path('logs').rglob('*'):
         if not p.is_file() or p.suffix not in ['.log','.json','.ndjson','.tsv','.txt']:continue
         s=p.read_text(errors='replace')
         for v in sorted(values,key=len,reverse=True):
          if len(v)>7:s=s.replace(v,'[REDACTED]')
         s=re.sub(r'https?://[^\s<>"\']+','[URL]',s)
         s=re.sub(r'(?i)\b(e|key|c|authenticity_token|action_code|item_code)=([^\s&<>]+)',r'\1=[REDACTED]',s)
         dest=out/p.relative_to('logs');dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(s)
        print('Sanitized diagnostics prepared; private wrappers excluded.')
        PY_LOG
    - name: Upload sanitized logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dc-v216-logs-${{ github.run_id }}
        path: logs-sanitized
        if-no-files-found: warn
        retention-days: 7
    - name: Remove private runtime
      if: always()
      shell: bash
      run: rm -f scripts/*_attacker.js scripts/*_wall.js; rm -rf .runtime-secret .runtime-debug
