name: Task Scheduler
run-name: "Task Scheduler / ${{ github.event.schedule || inputs.group }} / ${{ github.event_name == 'schedule' && 'dispatch' || inputs.mode }}"

# Cron times are UTC and start preparation BEFORE the approved dispatch times.
# scripts/task_scheduler.py waits for the actual target time in Asia/Tokyo.
on:
  schedule:
    # G1-G6 and J1-J2: dispatch at :10 and :40 every hour.
    - cron: '5,35 * * * *'
    # Greeting: 03:20 JST.
    - cron: '15 18 * * *'
    # Combined daily tasks: 09:17 JST.
    - cron: '12 0 * * *'
    # Normal summon: 17:20 JST.
    - cron: '15 8 * * *'
    # Enhance: 23:20 JST.
    - cron: '15 14 * * *'
    # SUB/SUB2 holywar: 09:59:30 and 11:59:30 JST.
    - cron: '54 0,2 * * *'
    # Main holywar: 20:59:30 and 21:59:30 JST.
    - cron: '54 11,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan: read-only checks / dispatch: send approved API requests'
        type: choice
        default: plan
        required: true
        options:
          - plan
          - dispatch
      group:
        description: 'Approved schedule group (auto is for scheduled events or plan)'
        type: choice
        default: auto
        required: true
        options:
          - auto
          - raid
          - greeting
          - daily
          - normal
          - enhance
          - sub
          - holy
      slot:
        description: 'Optional approved target time in ISO 8601 with timezone'
        type: string
        default: ''
        required: false

permissions:
  contents: read
  actions: write

# Serialize only the short dispatch controller, never the 26-minute child runs.
concurrency:
  group: task-scheduler-dispatch-main
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'sickness8484/browser-automation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the approved scheduler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check or dispatch the scheduled group
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ github.event_name == 'schedule' && 'dispatch' || inputs.mode }}
          DISPATCH_GROUP: ${{ inputs.group || 'auto' }}
          DISPATCH_SLOT: ${{ inputs.slot || '' }}
        run: |
          set -Eeuo pipefail
          python3 scripts/task_scheduler.py \
            --mode "$DISPATCH_MODE" \
            --group "$DISPATCH_GROUP" \
            --slot "$DISPATCH_SLOT"

      - name: Save dispatch receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: task-dispatch-report.json
          if-no-files-found: ignore
          retention-days: 14
