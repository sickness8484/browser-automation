name: "Runtime Worker"

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SYNC_DIR: ${{ github.workspace }}/.runtime-sync
      HW_ULTIMATE_CACHE_DIR: ${{ github.workspace }}/.task-state/runtime-cache
      HW_ULTIMATE_CACHE_MAX_AGE_MS: "1209600000"
      HW_SCRIPT_DIR: ${{ github.workspace }}/scripts
      HW_GLOBAL_SLOT_MS: "400"
      HW_LOCAL_GAP_MS: "2000"
      HW_POLL_MS: "520"
      HW_RUNTIME_MS: "7800000"
      HW_CHAIN_TIMEOUT_MS: "7800000"
      HW_POSSESSION_NAMES: ${{ vars.HW_POSSESSION_NAMES }}
      HW_RAPHA_MIN_AFFECTED: "3"
      HW_RAPHA_OFFENSE_LOSS: "0.18"
      HW_RAPHA_DEFENSE_LOSS: "0.22"
      HW_RAPHA_COOLDOWN_MS: "4200"
      HW_RAPHA_ALLOW_WORSHIP: "0"
      HW_RAPHA_ALLOW_SOUL: "0"
      HW_RAPHA_ALLOW_PURGATORY: "0"
      HW_RAPHA_ALLOW_HATRED: "1"
      HW_RAPHA_ALLOW_AZURE: "1"
      HW_PHYSICAL_BARRIER_MAX_WAIT_MS: "5200"
      HW_PURG1_FUMES_MIN_RESERVE: "1"
      HW_PURG2_FUMES_PREP_LIMIT: "16"
      HW_ENEMY_INTEL_TTL_MS: "18000"
      HW_SUPERBUFF_COUNTER_WINDOW_MS: "14000"
      HW_SUPERBUFF_MAX_RESPONSES: "3"
      HW_SUPERBUFF_ADRA_GRACE_MS: "1200"
      HW_SUPERBUFF_CHAIN_GAP_MS: "440"
      HW_SUPERBUFF_FASTLANE_MAX_LOCAL_WAIT_MS: "650"
      HW_SUPERBUFF_CLUSTER_MS: "2600"
      HW_RAPHA_ENEMY_BURST_LOOKAHEAD_S: "12"
      HW_RAPHA_SEVERE_LOSS: "0.30"
      HW_QUETZ_EV_GO: "500000000"
      HW_QUETZ_EV_RELATIVE: "1.25"
      HW_QUETZ_URGENT_SECONDS: "10"
      HW_QUETZ_REAR_URGENT_SECONDS: "15"
      HW_PAYLOAD_RESERVE_LEAD_SEC: "12"
      HW_AZURE_SETUP_LEAD_SEC: "30"
      HW_MIX_JOB_STALE_MS: "1800"
      HW_RECOVER_FAIL_BASE_BACKOFF_MS: "8000"
      HW_RECOVER_FAIL_MAX_BACKOFF_MS: "60000"
      HW_ATTACKER_BURST_JIT: "1"
      HW_ATTACKER_BURST_JIT_ACTIONS: "3"
      HW_ATTACKER_BURST_JIT_MIN_SEC: "28"
      HW_ATTACKER_BURST_JIT_THREE_ACTION_SEC: "45"
      HW_FUTURE_PAYLOAD_HIGH_COEFF: "96"
      HW_GABRIEL_RELAY_LIMIT: "3"
      HW_DAMAGE_MODEL: "continuous"
      HW_COMBO_OVER1600_SLOPE: "0.0625"
      HW_MELLOW_STRIP_WINDOW_MS: "22000"
      HW_MELLOW_STRIP_LIMIT: "10"
      HW_MELLOW_MIN_LEVEL: "17"
      HW_MELLOW_ROTATION_SHOTS: "3"
      HW_MELLOW_REAR_DELAY_MS: "6000"
      HW_HYDRA_NEAR_LIMIT: "64"
      HW_HYDRA_REMOTE_LIMIT: "64"
      HW_HYDRA_MIN_LEVEL: "1"
      HW_HYDRA_MIN_SECONDS_LEFT: "10"
      HW_HYDRA_REMOTE_INTERLEAVE_MS: "1100"
      HW_HYDRA_REMOTE_FLUSH_SECONDS: "12"
      HW_QUETZ_DROP_RESERVE_WP: "50"
      HW_GABRIEL_MIN_ACTIVE_MS: "1600"
      HW_GABRIEL_SEVERE_ACTIVE_MS: "2200"
      HW_ENEMY_AZURE_WALL_CADENCE_MS: "650"
      HW_GABRIEL_MIN_DYING: "5"
      HW_POSITION_COOLDOWN_MS: "6500"
      HW_POSITION_LEASE_MS: "14000"
      HW_REVIVE_PUNISH_WINDOW_MS: "7000"
      HW_ENEMY_CARRY_REENTRY_WINDOW_MS: "45000"
      HW_ENEMY_CARRY_REENTRY_MAX_STAGES: "3"
      HW_MAINTENANCE_WP_RESERVE: "60"
      HW_SPECIAL_SWAP_TO_NONWALL: "0"
      HW_ENEMY_AZURE_PRE_ADRA_SECONDS: "3"
      HW_ENEMY_AZURE_PRE_ADRA_CAP: "4"
      HW_ENEMY_AZURE_REBUFF_ADRA_CAP: "4"
      HW_ENEMY_AZURE_ADRA_BURST_WINDOW_MS: "2800"
      HW_AZURE_PRE_CLOUD_DEBUFF_CAP: "4"
      HW_ENEMY_ULT_BOARD_REPORT: "1"
      # Default: isolate errors and keep later phases running. Set both to "1" only for CI gating.
      HW_STRICT_PHASE_FAILURES: "0"
      HW_STRICT_FINAL: "0"

    steps:
      - name: Prepare runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Restore script fragments
        shell: bash
        env:
          COMBO_SUHAI_JS: ${{ secrets.COMBO_SUHAI_JS }}
          NOCOMBO_SUHAI_JS: ${{ secrets.NOCOMBO_SUHAI_JS }}
          ATTACKER_YELLOW_JS: ${{ secrets.ATTACKER_YELLOW_JS }}
          WALL_YELLOW_JS: ${{ secrets.WALL_YELLOW_JS }}
          PURGATORY_ATTACKER_JS: ${{ secrets.PURGATORY_ATTACKER_JS }}
          PURGATORY_WALL_JS: ${{ secrets.PURGATORY_WALL_JS }}
          HATRED_ATTACKER_JS: ${{ secrets.HATRED_ATTACKER_JS }}
          HATRED_WALL_JS: ${{ secrets.HATRED_WALL_JS }}
          AZURE_ATTACKER_JS: ${{ secrets.AZURE_ATTACKER_JS }}
          AZURE_WALL_JS: ${{ secrets.AZURE_WALL_JS }}
        run: |
          set +e
          mkdir -p scripts logs .runtime-sync .runtime-debug
          : > logs/restore_status.tsv
          declare -A MAP=(
            [COMBO_SUHAI_JS]=worship_attacker.js
            [NOCOMBO_SUHAI_JS]=worship_wall.js
            [ATTACKER_YELLOW_JS]=soul_attacker.js
            [WALL_YELLOW_JS]=soul_wall.js
            [PURGATORY_ATTACKER_JS]=purgatory_attacker.js
            [PURGATORY_WALL_JS]=purgatory_wall.js
            [HATRED_ATTACKER_JS]=hatred_attacker.js
            [HATRED_WALL_JS]=hatred_wall.js
            [AZURE_ATTACKER_JS]=azure_attacker.js
            [AZURE_WALL_JS]=azure_wall.js
          )
          for key in "${!MAP[@]}"; do
            file="scripts/${MAP[$key]}"
            if [ -z "${!key:-}" ]; then
              printf '%s\t%s\n' "${MAP[$key]}" "missing-secret" >> logs/restore_status.tsv
              continue
            fi
            printf '%s' "${!key}" > "$file"
            bytes=$(wc -c < "$file")
            if [ "$bytes" -gt 49152 ]; then
              printf '%s\t%s\n' "${MAP[$key]}" "oversize:$bytes" >> logs/restore_status.tsv
              rm -f "$file"
              continue
            fi
            if ! node --check "$file" >/dev/null 2>&1; then
              printf '%s\t%s\n' "${MAP[$key]}" "syntax-error" >> logs/restore_status.tsv
              rm -f "$file"
              continue
            fi
            if ! grep -Eq 'mail_confirmation\?|__HW_AUTH_COUNT__=[1-9][0-9]*' "$file"; then
              printf '%s\t%s\n' "${MAP[$key]}" "auth-block-missing" >> logs/restore_status.tsv
              rm -f "$file"
              continue
            fi
            printf '%s\t%s\n' "${MAP[$key]}" "ready:$bytes" >> logs/restore_status.tsv
          done
          invalid=$(awk -F '\t' '$2 !~ /^ready:/ {count++} END {print count+0}' logs/restore_status.tsv)
          ready=$((10-invalid))
          {
            echo '## Runtime fragment restore'
            echo
            echo "- Ready fragments: $ready/10"
            echo "- Invalid fragments: $invalid"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$invalid" -ne 0 ]; then
            echo "::error title=Runtime startup blocked::$invalid required fragment(s) are missing or invalid."
            exit 1
          fi
          rm -rf .runtime-sync .runtime-debug
          mkdir -p .runtime-sync .runtime-debug logs

      - name: Restore runtime bundle
        shell: bash
        env:
          HW_CORE_01: ${{ secrets.HW_CORE_01 }}
          HW_CORE_02: ${{ secrets.HW_CORE_02 }}
          HW_CORE_03: ${{ secrets.HW_CORE_03 }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p scripts logs .runtime-secret
          trap 'rm -rf .runtime-secret' EXIT

          missing=0
          for key in HW_CORE_01 HW_CORE_02 HW_CORE_03; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Secret core missing::$key is empty. Copy all three core chunks from the release artifact into Repository Secrets."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          printf '%s%s%s' "$HW_CORE_01" "$HW_CORE_02" "$HW_CORE_03" > .runtime-secret/core.b64
          actual_b64_bytes=$(wc -c < .runtime-secret/core.b64 | tr -d ' ')
          expected_b64_bytes="121368"
          if [ "$actual_b64_bytes" != "$expected_b64_bytes" ]; then
            echo "::error title=Secret core length mismatch::expected=$expected_b64_bytes actual=$actual_b64_bytes"
            exit 1
          fi

          if ! base64 --decode .runtime-secret/core.b64 > .runtime-secret/core.tar.xz; then
            echo "::error title=Secret core decode failed::HW_CORE_01..03 are not the expected base64 bundle."
            exit 1
          fi
          archive_sha=$(sha256sum .runtime-secret/core.tar.xz | awk '{print $1}')
          expected_archive_sha="846cc60c3deca23e1222d64752ae09f544734c68124046ce47465a82449edbf7"
          if [ "$archive_sha" != "$expected_archive_sha" ]; then
            echo "::error title=Secret core SHA-256 mismatch::expected=$expected_archive_sha actual=$archive_sha"
            exit 1
          fi

          tar -tJf .runtime-secret/core.tar.xz | sed 's#^\./##' | sort > .runtime-secret/archive_paths.txt
          cat > .runtime-secret/expected_paths.txt <<'EOF'
          phase_supervisor.js
          preflight_roster.js
          scripts/holywar_engine_v299.js
          scripts/holywar_policy_v299.js
          scripts/release_gate.js
          tests/runtime_regression.js
          EOF
          sort -o .runtime-secret/expected_paths.txt .runtime-secret/expected_paths.txt
          if ! diff -u .runtime-secret/expected_paths.txt .runtime-secret/archive_paths.txt >/dev/null; then
            echo "::error title=Secret core archive layout mismatch::unexpected file list; extraction refused."
            exit 1
          fi

          tar -xJf .runtime-secret/core.tar.xz -C "$GITHUB_WORKSPACE"
          chmod 600 preflight_roster.js phase_supervisor.js scripts/holywar_engine_v299.js scripts/holywar_policy_v299.js scripts/release_gate.js tests/runtime_regression.js

          verify_file() {
            local file="$1" expected="$2" label="$3" actual
            [ -f "$file" ] || { echo "::error title=Runtime file missing::$label"; exit 1; }
            actual=$(sha256sum "$file" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "::error title=Runtime file hash mismatch::$label"
              exit 1
            fi
          }
          verify_file preflight_roster.js "e6aa8ae8cb28f953d3a1d8e14acbb91374a54f33410facd9df1c8c59787da95b" "component-01"
          verify_file phase_supervisor.js "bd67dd637f1af41c74d53eb20e56972df13173f24011fa47ba3655c5db6686df" "component-02"
          verify_file scripts/holywar_engine_v299.js "671ed58456ef7afb87a8e8bc700cbc3a355ab1b45360675b112a875dea45ebd6" "component-03"
          verify_file scripts/holywar_policy_v299.js "86005913fd7033ec911943733e6abf5d226496608148f5e0e2e8f8b491ace726" "component-04"
          verify_file scripts/release_gate.js "836367e7817a87f6641fa76d3d5fbde88c9f4dd900760da2b7026ef5a6124ba7" "component-05"
          verify_file tests/runtime_regression.js "c1eb2bd64cc58ad950d651292b40e61822c980dbc4ee5dc4a5ad87e8b50b1917" "component-06"

          node --check preflight_roster.js
          node --check scripts/holywar_policy_v299.js
          node --check scripts/holywar_engine_v299.js
          node --check phase_supervisor.js
          node --check scripts/release_gate.js
          node --check tests/runtime_regression.js
          node scripts/release_gate.js 2>&1 | tee logs/release_gate.log
          HW_TEST_MODE=1 node tests/runtime_regression.js 2>&1 | tee logs/runtime_regression.log
          cat > logs/core_restore_status.json <<EOF
          {
            "version": "2.10.0-rc6-wall-support-revive",
            "source": "repository-secrets",
            "chunks": 3,
            "base64Bytes": $actual_b64_bytes,
            "archiveSha256": "$archive_sha",
            "engineSha256": "671ed58456ef7afb87a8e8bc700cbc3a355ab1b45360675b112a875dea45ebd6",
            "preflightSha256": "e6aa8ae8cb28f953d3a1d8e14acbb91374a54f33410facd9df1c8c59787da95b",
            "supervisorSha256": "bd67dd637f1af41c74d53eb20e56972df13173f24011fa47ba3655c5db6686df",
            "policySha256": "86005913fd7033ec911943733e6abf5d226496608148f5e0e2e8f8b491ace726",
            "gateSha256": "836367e7817a87f6641fa76d3d5fbde88c9f4dd900760da2b7026ef5a6124ba7",
            "testSha256": "c1eb2bd64cc58ad950d651292b40e61822c980dbc4ee5dc4a5ad87e8b50b1917"
          }
          EOF
          echo "Runtime bundle restored: integrity, static gates, and synthetic regression passed."

      - name: Restore runtime cache
        uses: actions/cache/restore@v4
        with:
          path: .task-state/runtime-cache
          key: runtime-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            runtime-state-${{ github.ref_name }}-

      - name: Validate runtime inputs
        id: preflight
        shell: bash
        run: |
          set +e
          node preflight_roster.js 2>&1 | tee logs/preflight.log
          status=${PIPESTATUS[0]}
          echo "$status" > logs/preflight_exit_code.txt
          if [ "$status" -ne 0 ]; then
            echo "::error title=Runtime input validation failed::Required allocation or cached state is incomplete. See uploaded diagnostics."
            exit "$status"
          fi
          test -f .runtime-sync/hw.global.resource_plan
          echo "hw.global.resource_plan available"


      - name: Save runtime cache
        if: ${{ steps.preflight.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .task-state/runtime-cache
          key: runtime-state-${{ github.ref_name }}-${{ github.run_id }}


      - name: Execute runtime
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node phase_supervisor.js 2>&1 | tee logs/supervisor.log
          status=${PIPESTATUS[0]}
          echo "$status" > logs/supervisor_exit_code.txt
          echo "Runtime exited $status; result collection will still run."
          exit 0

      - name: Collect results
        if: always()
        shell: bash
        run: |
          set +e
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const phases=['worship','soul','purgatory','hatred','azure'];
          const sync='.runtime-sync';
          const done=phases.filter(x=>fs.existsSync(path.join(sync,`hw.phase.${x}.done`)));
          const missing=phases.filter(x=>!done.includes(x));
          const failures=fs.existsSync(sync)?fs.readdirSync(sync).filter(x=>x.startsWith('hw.failure.')||x==='hw.supervisor.degraded'):[];
          const readNdjson=file=>{try{return fs.readFileSync(file,'utf8').split(/\n+/).filter(Boolean).map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean)}catch{return[]}};
          const abilities=readNdjson('logs/ability_results.ndjson'), mutations=readNdjson('logs/mutation_starts.ndjson');
          const by=(rows,key)=>rows.reduce((o,r)=>{const k=String(r[key]||'UNKNOWN');o[k]=(o[k]||0)+1;return o;},{});
          const success=abilities.filter(r=>r.result==='success'), unknown=abilities.filter(r=>r.result==='unknown');
          const rollup={version:'2.10.0-rc6-wall-support-revive',totalMutations:mutations.length,totalAbilityResults:abilities.length,successes:success.length,unknown:unknown.length,castsByPhase:by(success,'phase'),castsBySkill:by(success,'skill'),mutationsByPhase:by(mutations,'phase')};
          const result={version:'2.10.0-rc6-wall-support-revive',done,missing,failures,degraded:missing.length>0||failures.length>0,strict:process.env.HW_STRICT_FINAL==='1'};
          fs.mkdirSync('logs',{recursive:true});
          fs.writeFileSync('logs/final_chain_status.json',JSON.stringify(result,null,2));
          fs.writeFileSync('logs/runtime_rollup.json',JSON.stringify(rollup,null,2));
          console.log(JSON.stringify(result,null,2));
          if(process.env.GITHUB_STEP_SUMMARY){
            const rows=[
              '## Runtime final status',
              '',
              `- Completed units: ${done.length}/${phases.length}`,
              `- Missing units: ${missing.length}`,
              `- Failure markers: ${failures.length}`,
              `- Degraded: ${result.degraded}`
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join('\n')+'\n');
          }
          if(result.degraded)console.log(`::warning title=Runtime degraded::missing=${missing.length} failures=${failures.length}`);
          if(result.strict&&result.degraded)process.exitCode=1;
          NODE
          find .runtime-sync -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort > logs/final_sync_files.txt || true
          for file in logs/*_attacker.log logs/*_wall.log; do
            [ -f "$file" ] && { echo "===== $file ====="; tail -300 "$file"; }
          done
          true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-results-${{ github.run_id }}
          path: |
            logs
            .runtime-sync
            .runtime-debug
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Cleanup runtime
        if: always()
        shell: bash
        run: |
          set +e
          rm -f preflight_roster.js phase_supervisor.js scripts/holywar_engine_v299.js scripts/holywar_policy_v299.js scripts/release_gate.js tests/runtime_regression.js
          rm -rf .runtime-secret
          true

