name: "Task C"

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Setup runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Restore inputs
        shell: bash
        env:
          INPUT_A: ${{ secrets.COMBO_SUHAI_JS }}
          INPUT_B: ${{ secrets.NOCOMBO_SUHAI_JS }}
          INPUT_C: ${{ secrets.ATTACKER_YELLOW_JS }}
          INPUT_D: ${{ secrets.WALL_YELLOW_JS }}
        run: |
          set -Eeuo pipefail
          for v in INPUT_A INPUT_B INPUT_C INPUT_D; do
            test -n "${!v}" || { echo "$v is empty"; exit 1; }
          done
          printf '%s' "$INPUT_A" > combo_suhai_js
          printf '%s' "$INPUT_B" > nocombo_suhai_js
          printf '%s' "$INPUT_C" > attacker_yellow_js
          printf '%s' "$INPUT_D" > wall_yellow_js
          for f in combo_suhai_js nocombo_suhai_js attacker_yellow_js wall_yellow_js; do
            node --check "$f"
            test "$(wc -c < "$f")" -le 49152
          done
          rm -rf .runtime-sync .runtime-debug
          mkdir -p .runtime-sync .runtime-debug

      - name: Run chain
        shell: bash
        env:
          SYNC_DIR: ${{ github.workspace }}/.runtime-sync
          COMBO_SLOT_MS: "420"
          COMBO_RECOVER_EARLY_WP: "25"
        run: |
          set +e
          PIDS=""
          cleanup() {
            for p in $PIDS; do
              kill "$p" 2>/dev/null || true
            done
          }
          trap cleanup EXIT INT TERM

          node combo_suhai_js & PID_A=$!; PIDS="$PIDS $PID_A"
          node nocombo_suhai_js & PID_B=$!; PIDS="$PIDS $PID_B"

          HANDOFF=0
          for i in $(seq 1 9600); do
            if [ -f .runtime-sync/suhai.handoff ]; then
              HANDOFF=1
              echo "handoff detected after $((i / 5))s"
              break
            fi
            if ! kill -0 "$PID_A" 2>/dev/null && ! kill -0 "$PID_B" 2>/dev/null; then
              echo "both suhai processes exited before handoff"
              break
            fi
            if [ $((i % 300)) -eq 0 ]; then
              echo "handoff wait $((i / 5))s"
              find .runtime-sync -maxdepth 1 -type f -printf '%f\n' | sort | tail -40
            fi
            sleep 0.2
          done

          if [ "$HANDOFF" -ne 1 ]; then
            echo "handoff missing"
            cleanup
            wait "$PID_A"; STATUS_A=$?
            wait "$PID_B"; STATUS_B=$?
            echo "A status: $STATUS_A"
            echo "B status: $STATUS_B"
            echo "final sync markers:"
            find .runtime-sync -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          node attacker_yellow_js & PID_C=$!; PIDS="$PIDS $PID_C"
          node wall_yellow_js & PID_D=$!; PIDS="$PIDS $PID_D"

          wait "$PID_A"; STATUS_A=$?
          wait "$PID_B"; STATUS_B=$?
          wait "$PID_C"; STATUS_C=$?
          wait "$PID_D"; STATUS_D=$?

          echo "A status: $STATUS_A"
          echo "B status: $STATUS_B"
          echo "C status: $STATUS_C"
          echo "D status: $STATUS_D"
          trap - EXIT INT TERM
          if [ "$STATUS_A" -ne 0 ] || [ "$STATUS_B" -ne 0 ] || [ "$STATUS_C" -ne 0 ] || [ "$STATUS_D" -ne 0 ]; then exit 1; fi


      - name: Upload sanitized war debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-c-sanitized-debug-${{ github.run_id }}
          path: .runtime-debug
          if-no-files-found: ignore
          retention-days: 3
