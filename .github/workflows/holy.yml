name: "Runtime Worker"

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: "${{ github.workspace }}/.cache/ms-playwright"

    steps:

      # ============================================================
      # 1. Node.js
      # ============================================================

      - name: Prepare runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # 2. Install Playwright npm package
      # ============================================================

      - name: Install Playwright package
        shell: bash
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail

          echo "::group::Initialize npm"
          npm init -y >/dev/null 2>&1
          echo "::endgroup::"

          echo "::group::Install Playwright"

          success=0

          for attempt in 1 2 3; do
            echo "npm install attempt ${attempt}/3"

            if timeout 180s npm install \
              --no-save \
              --no-audit \
              --no-fund \
              playwright
            then
              success=1
              break
            fi

            echo "::warning title=Playwright install retry::attempt ${attempt}/3 failed"

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error title=Playwright installation failed::npm installation failed after 3 attempts"
            exit 1
          fi

          node -e "console.log('Playwright version:', require('playwright/package.json').version)"

          echo "::endgroup::"

      # ============================================================
      # 3. Restore Chromium cache
      # ============================================================

      - name: Restore browser cache
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright/package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ runner.arch }}-

      # ============================================================
      # 4. Install + verify Chromium
      #
      # heredocは一切使用しない。
      # 最初から --with-deps は使わず、
      # 実際にChromium起動失敗した場合のみinstall-depsする。
      # ============================================================

      - name: Install browser runtime
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$PLAYWRIGHT_BROWSERS_PATH" \
            logs \
            .runtime-debug

          echo "Browser cache hit: ${{ steps.browser-cache.outputs.cache-hit }}"

          echo "::group::Install Chromium"

          installed=0

          for attempt in 1 2 3; do
            echo "Chromium install attempt ${attempt}/3"

            if timeout 300s npx playwright install chromium
            then
              installed=1
              break
            fi

            echo "::warning title=Chromium installation retry::attempt ${attempt}/3 failed or timed out"

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          if [ "$installed" -ne 1 ]; then
            echo "::error title=Chromium installation failed::browser installation failed after 3 attempts"
            exit 1
          fi

          echo "::endgroup::"

          echo "::group::Verify Chromium"

          set +e

          timeout 60s node -e "
          const { chromium } = require('playwright');
          (async () => {
            const started = Date.now();

            const browser = await chromium.launch({
              headless: true,
              args: ['--disable-dev-shm-usage']
            });

            const page = await browser.newPage();

            await page.setContent(
              '<!doctype html><html><body>runtime-ok</body></html>'
            );

            const value = await page.textContent('body');

            if (value !== 'runtime-ok') {
              throw new Error('Unexpected browser verification result: ' + value);
            }

            await browser.close();

            console.log(
              'Chromium launch verification OK (' +
              (Date.now() - started) +
              ' ms)'
            );
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          "

          verify_code=$?

          set -e

          echo "::endgroup::"

          if [ "$verify_code" -ne 0 ]; then

            echo "::warning title=Browser dependency fallback::Chromium installed but initial launch failed"

            echo "::group::Install Linux browser dependencies"

            if ! timeout 420s npx playwright install-deps chromium
            then
              echo "::error title=Browser dependency installation failed::install-deps failed or timed out"
              exit 1
            fi

            echo "::endgroup::"

            echo "::group::Verify Chromium after dependency installation"

            timeout 60s node -e "
            const { chromium } = require('playwright');
            (async () => {
              const started = Date.now();

              const browser = await chromium.launch({
                headless: true,
                args: ['--disable-dev-shm-usage']
              });

              const page = await browser.newPage();

              await page.setContent(
                '<!doctype html><html><body>runtime-ok</body></html>'
              );

              const value = await page.textContent('body');

              if (value !== 'runtime-ok') {
                throw new Error('Unexpected browser verification result: ' + value);
              }

              await browser.close();

              console.log(
                'Chromium launch verification OK after dependency installation (' +
                (Date.now() - started) +
                ' ms)'
              );
            })().catch(error => {
              console.error(error);
              process.exit(1);
            });
            "

            echo "::endgroup::"
          fi

          echo "Browser runtime ready."

      # ============================================================
      # 5. Save Chromium cache
      # ============================================================

      - name: Save browser cache
        if: ${{ success() && steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright/package.json') }}

      # ============================================================
      # 6. Reconstruct runtime package
      # ============================================================

      - name: Load package
        shell: bash
        timeout-minutes: 5
        env:
          PKG_01: ${{ secrets.PKG_01 }}
          PKG_02: ${{ secrets.PKG_02 }}
          PKG_03: ${{ secrets.PKG_03 }}
        run: |
          set -Eeuo pipefail
          umask 077

          mkdir -p .pkg logs .runtime-debug

          cleanup_pkg() {
            rm -rf .pkg
          }

          trap cleanup_pkg EXIT

          echo "Checking package segments..."

          for k in PKG_01 PKG_02 PKG_03; do
            if [ -z "${!k:-}" ]; then
              echo "::error title=Runtime package unavailable::${k} is missing or empty"
              exit 1
            fi
          done

          echo "Joining package segments..."

          printf '%s%s%s' \
            "$PKG_01" \
            "$PKG_02" \
            "$PKG_03" \
            > .pkg/payload.b64

          actual_length="$(
            wc -c < .pkg/payload.b64 |
            tr -d '[:space:]'
          )"

          expected_length="133768"

          echo "Package encoded length: ${actual_length}"

          if [ "$actual_length" != "$expected_length" ]; then
            echo "::error title=Runtime package invalid::length check failed; expected=${expected_length}; actual=${actual_length}"
            exit 1
          fi

          echo "Package length OK."

          echo "Decoding runtime package..."

          if ! base64 --decode \
            .pkg/payload.b64 \
            > .pkg/payload.bin
          then
            echo "::error title=Runtime package invalid::base64 decoding failed"
            exit 1
          fi

          echo "Checking package integrity..."

          actual_sha="$(
            sha256sum .pkg/payload.bin |
            awk '{print $1}'
          )"

          expected_sha="9bc4904f0c354fcd3e9b1420e7012eab21fd24e8dc2e0ebfa6a664f66d9ca9be"

          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error title=Runtime package invalid::SHA-256 integrity check failed"
            exit 1
          fi

          echo "Package integrity OK."

          echo "Extracting package..."

          if ! tar \
            -xzf .pkg/payload.bin \
            -C "$GITHUB_WORKSPACE"
          then
            echo "::error title=Runtime package invalid::archive extraction failed"
            exit 1
          fi

          if [ ! -f ctl.js ]; then
            echo "::error title=Runtime package invalid::ctl.js was not produced"
            exit 1
          fi

          echo "Checking controller syntax..."

          node --check ctl.js

          echo "Package ready."

      # ============================================================
      # 7. Restore UNIT secrets
      # ============================================================

      - name: Load units
        shell: bash
        timeout-minutes: 10
        env:
          UNIT_01: ${{ secrets.COMBO_SUHAI_JS }}
          UNIT_02: ${{ secrets.NOCOMBO_SUHAI_JS }}
          UNIT_03: ${{ secrets.ATTACKER_YELLOW_JS }}
          UNIT_04: ${{ secrets.WALL_YELLOW_JS }}
          UNIT_05: ${{ secrets.PURGATORY_ATTACKER_JS }}
          UNIT_06: ${{ secrets.PURGATORY_WALL_JS }}
          UNIT_07: ${{ secrets.HATRED_ATTACKER_JS }}
          UNIT_08: ${{ secrets.HATRED_WALL_JS }}
          UNIT_09: ${{ secrets.AZURE_ATTACKER_JS }}
          UNIT_10: ${{ secrets.AZURE_WALL_JS }}
        run: |
          set +e

          mkdir -p logs .runtime-debug

          : > .runtime-debug/restore.stdout.log
          : > .runtime-debug/restore.stderr.log

          timeout 540s node ctl.js restore \
            > .runtime-debug/restore.stdout.log \
            2> .runtime-debug/restore.stderr.log

          code=$?

          echo "$code" > logs/restore_exit.txt

          cat \
            .runtime-debug/restore.stdout.log \
            .runtime-debug/restore.stderr.log \
            > .runtime-debug/restore.raw.log \
            2>/dev/null || true

          if [ "$code" -ne 0 ]; then

            bytes="$(
              wc -c < .runtime-debug/restore.raw.log \
              2>/dev/null |
              tr -d '[:space:]'
            )"

            fingerprint="$(
              sha256sum .runtime-debug/restore.raw.log \
              2>/dev/null |
              awk '{print $1}'
            )"

            printf \
              'code=LOAD_UNIT\nexit=%s\nbytes=%s\nfingerprint=%s\n' \
              "$code" \
              "${bytes:-0}" \
              "${fingerprint:-none}" \
              > logs/restore_summary.txt

            if [ "$code" -eq 124 ]; then
              echo "::error title=Unit loading timed out::ctl.js restore exceeded 540 seconds"
            else
              echo "::error title=Runtime initialization failed::code=LOAD_UNIT; exit=${code}; diagnostics retained"
            fi

            exit "$code"
          fi

          echo "Units ready."

      # ============================================================
      # 8. Prepare persistent state
      # ============================================================

      - name: Prepare state directory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .state/cache

      # ============================================================
      # 9. Restore previous state
      # ============================================================

      - name: Restore state
        id: state-restore
        uses: actions/cache/restore@v4
        with:
          path: .state/cache
          key: runtime-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            runtime-state-${{ github.ref_name }}-

      # ============================================================
      # 10. Initialize controller
      # ============================================================

      - name: Initialize
        id: init
        shell: bash
        timeout-minutes: 20
        run: |
          set +e

          mkdir -p \
            logs \
            .runtime-debug \
            .state/cache

          : > .runtime-debug/init.stdout.log
          : > .runtime-debug/init.stderr.log

          timeout 1140s node ctl.js pre \
            > .runtime-debug/init.stdout.log \
            2> .runtime-debug/init.stderr.log

          code=$?

          echo "$code" > logs/init_exit.txt

          cat \
            .runtime-debug/init.stdout.log \
            .runtime-debug/init.stderr.log \
            > .runtime-debug/init.raw.log \
            2>/dev/null || true

          bytes="$(
            wc -c < .runtime-debug/init.raw.log \
            2>/dev/null |
            tr -d '[:space:]'
          )"

          fingerprint="$(
            sha256sum .runtime-debug/init.raw.log \
            2>/dev/null |
            awk '{print $1}'
          )"

          category="UNKNOWN"

          if grep -Eqi \
            "MODULE_NOT_FOUND|Cannot find module|Executable doesn't exist|browser executable" \
            .runtime-debug/init.raw.log
          then
            category="DEPENDENCY"

          elif grep -Eqi \
            "ENOENT|EACCES|EPERM|read-only file system|no such file" \
            .runtime-debug/init.raw.log
          then
            category="FILESYSTEM"

          elif grep -Eqi \
            "ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|net::ERR_|429|502|503|504" \
            .runtime-debug/init.raw.log
          then
            category="NETWORK"

          elif grep -Eqi \
            "401|403|unauthorized|forbidden|authentication failed|login required|session expired" \
            .runtime-debug/init.raw.log
          then
            category="ACCESS"

          elif grep -Eqi \
            "playwright|chromium|browserType|Target page.*closed|browser has been closed|page.goto|navigation failed" \
            .runtime-debug/init.raw.log
          then
            category="BROWSER"

          elif grep -Eqi \
            "timeout|timed out|exceeded.*time" \
            .runtime-debug/init.raw.log
          then
            category="TIMEOUT"

          elif grep -Eqi \
            "validation|integrity|mismatch|required|invalid|missing|unexpected state" \
            .runtime-debug/init.raw.log
          then
            category="VALIDATION"

          elif grep -Eqi \
            "cache|restore state|state file|cursor state|checkpoint" \
            .runtime-debug/init.raw.log
          then
            category="STATE"
          fi

          printf \
            'code=INIT_%s\nexit=%s\nbytes=%s\nfingerprint=%s\n' \
            "$category" \
            "$code" \
            "${bytes:-0}" \
            "${fingerprint:-none}" \
            > logs/init_summary.txt

          # Artifactに保存するログは最低限サニタイズ。
          # rawログ自体は外へアップロードしない。
          sed \
            -E \
            -e 's#https?://[^[:space:]"<>]+#[url]#g' \
            -e 's/([Aa]uthorization|[Cc]ookie|[Tt]oken|[Ss]ecret|[Ss]ession)([^:=]{0,40})[:=][[:space:]]*[^[:space:]]+/\1\2=[redacted]/g' \
            .runtime-debug/init.raw.log \
            > .runtime-debug/init.sanitized.log \
            2>/dev/null || true

          if [ -f .runtime-debug/init.sanitized.log ]; then
            safe_size="$(
              wc -c < .runtime-debug/init.sanitized.log |
              tr -d '[:space:]'
            )"

            if [ "${safe_size:-0}" -gt 250000 ]; then
              head -c 250000 \
                .runtime-debug/init.sanitized.log \
                > .runtime-debug/init.sanitized.tmp

              printf '\n[truncated]\n' \
                >> .runtime-debug/init.sanitized.tmp

              mv \
                .runtime-debug/init.sanitized.tmp \
                .runtime-debug/init.sanitized.log
            fi
          fi

          # rawログはartifactに入れない
          rm -f .runtime-debug/init.raw.log

          if [ "$code" -ne 0 ]; then

            if [ "$code" -eq 124 ]; then
              echo "::error title=Initialization timed out::ctl.js pre exceeded 1140 seconds"
            else
              echo "::error title=Initialization failed::code=INIT_${category}; exit=${code}; diagnostic-bytes=${bytes:-0}"
            fi

            exit "$code"
          fi

          echo "Initialization complete."

      # ============================================================
      # 11. Save initialized state
      # ============================================================

      - name: Save state
        if: ${{ steps.init.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .state/cache
          key: runtime-state-${{ github.ref_name }}-${{ github.run_id }}

      # ============================================================
      # 12. Execute workload
      # ============================================================

      - name: Execute
        id: execute
        continue-on-error: true
        shell: bash
        timeout-minutes: 100
        run: |
          set +e

          mkdir -p logs .runtime-debug

          : > .runtime-debug/run.stdout.log
          : > .runtime-debug/run.stderr.log

          timeout 5940s node ctl.js run \
            > .runtime-debug/run.stdout.log \
            2> .runtime-debug/run.stderr.log

          code=$?

          echo "$code" > logs/run_exit.txt

          cat \
            .runtime-debug/run.stdout.log \
            .runtime-debug/run.stderr.log \
            > .runtime-debug/run.raw.log \
            2>/dev/null || true

          bytes="$(
            wc -c < .runtime-debug/run.raw.log \
            2>/dev/null |
            tr -d '[:space:]'
          )"

          fingerprint="$(
            sha256sum .runtime-debug/run.raw.log \
            2>/dev/null |
            awk '{print $1}'
          )"

          if [ "$code" -eq 0 ]; then
            run_status="OK"

          elif [ "$code" -eq 124 ]; then
            run_status="TIMEOUT"

          else
            run_status="FAILED"
          fi

          printf \
            'code=RUN_%s\nexit=%s\nbytes=%s\nfingerprint=%s\n' \
            "$run_status" \
            "$code" \
            "${bytes:-0}" \
            "${fingerprint:-none}" \
            > logs/run_summary.txt

          # runログも最低限サニタイズしてartifactに残す
          sed \
            -E \
            -e 's#https?://[^[:space:]"<>]+#[url]#g' \
            -e 's/([Aa]uthorization|[Cc]ookie|[Tt]oken|[Ss]ecret|[Ss]ession)([^:=]{0,40})[:=][[:space:]]*[^[:space:]]+/\1\2=[redacted]/g' \
            .runtime-debug/run.raw.log \
            > .runtime-debug/run.sanitized.log \
            2>/dev/null || true

          rm -f .runtime-debug/run.raw.log

          echo "Execution finished with status ${code} (${run_status})."

          # 後処理とdiagnostics uploadを必ず通すため、
          # このstep自体は成功扱いにする。
          exit 0

      # ============================================================
      # 13. Finalize
      # ============================================================

      - name: Finalize
        if: always()
        shell: bash
        timeout-minutes: 10
        run: |
          set +e

          mkdir -p logs .runtime-debug

          if [ -f ctl.js ]; then

            : > .runtime-debug/post.stdout.log
            : > .runtime-debug/post.stderr.log

            timeout 540s node ctl.js post \
              > .runtime-debug/post.stdout.log \
              2> .runtime-debug/post.stderr.log

            post_code=$?

            echo "$post_code" > logs/post_exit.txt

            if [ "$post_code" -eq 124 ]; then
              echo "::warning title=Finalize timeout::ctl.js post exceeded 540 seconds"

            elif [ "$post_code" -ne 0 ]; then
              echo "::warning title=Finalize failed::ctl.js post exit=${post_code}"

            else
              echo "Finalize complete."
            fi
          else
            echo "ctl.js unavailable; finalize skipped."
          fi

          if [ -f logs/status.json ]; then

            node -e "
            const fs = require('fs');

            try {
              const x = JSON.parse(
                fs.readFileSync('logs/status.json', 'utf8')
              );

              console.log(
                'Completed ' +
                (x.completed ?? '?') +
                '/' +
                (x.total ?? '?') +
                '; issues=' +
                (x.failureCount ?? '?')
              );
            } catch (error) {
              console.log(
                'status.json exists but could not be parsed: ' +
                error.message
              );
            }
            "

          else
            echo "Status unavailable; inspect diagnostics."
          fi

          true

      # ============================================================
      # 14. Remove potentially sensitive stdout/stderr before upload
      # ============================================================

      - name: Prepare diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p logs .runtime-debug

          # stdout/stderrにはURL・cookie等が含まれる可能性があるため
          # 原文はartifactへ送らない。
          rm -f \
            .runtime-debug/init.stdout.log \
            .runtime-debug/init.stderr.log \
            .runtime-debug/run.stdout.log \
            .runtime-debug/run.stderr.log

          # postログもsanitized版へ変換
          if [ -f .runtime-debug/post.stdout.log ] || \
             [ -f .runtime-debug/post.stderr.log ]
          then
            cat \
              .runtime-debug/post.stdout.log \
              .runtime-debug/post.stderr.log \
              > .runtime-debug/post.raw.log \
              2>/dev/null || true

            sed \
              -E \
              -e 's#https?://[^[:space:]"<>]+#[url]#g' \
              -e 's/([Aa]uthorization|[Cc]ookie|[Tt]oken|[Ss]ecret|[Ss]ession)([^:=]{0,40})[:=][[:space:]]*[^[:space:]]+/\1\2=[redacted]/g' \
              .runtime-debug/post.raw.log \
              > .runtime-debug/post.sanitized.log \
              2>/dev/null || true

            rm -f \
              .runtime-debug/post.raw.log \
              .runtime-debug/post.stdout.log \
              .runtime-debug/post.stderr.log
          fi

          # restoreログもsanitized版へ変換
          if [ -f .runtime-debug/restore.raw.log ]; then

            sed \
              -E \
              -e 's#https?://[^[:space:]"<>]+#[url]#g' \
              -e 's/([Aa]uthorization|[Cc]ookie|[Tt]oken|[Ss]ecret|[Ss]ession)([^:=]{0,40})[:=][[:space:]]*[^[:space:]]+/\1\2=[redacted]/g' \
              .runtime-debug/restore.raw.log \
              > .runtime-debug/restore.sanitized.log \
              2>/dev/null || true

            rm -f \
              .runtime-debug/restore.raw.log \
              .runtime-debug/restore.stdout.log \
              .runtime-debug/restore.stderr.log
          fi

          true

      # ============================================================
      # 15. Upload diagnostics
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-data-${{ github.run_id }}
          path: |
            logs
            .runtime-sync
            .runtime-debug
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      # ============================================================
      # 16. Cleanup
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          set +e

          if [ -f ctl.js ]; then

            timeout 240s node ctl.js cleanup \
              >/dev/null \
              2>&1 || true
          fi

          rm -rf .pkg

          echo "Cleanup complete."

          true
