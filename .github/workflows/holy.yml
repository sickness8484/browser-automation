name: "Runtime Worker"

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Prepare runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Load package
        shell: bash
        env:
          PKG_01: ${{ secrets.PKG_01 }}
          PKG_02: ${{ secrets.PKG_02 }}
          PKG_03: ${{ secrets.PKG_03 }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p .pkg logs .runtime-debug
          trap 'rm -rf .pkg' EXIT
          for k in PKG_01 PKG_02 PKG_03; do
            [ -n "${!k:-}" ] || { echo "::error title=Runtime package unavailable::one or more package segments are missing"; exit 1; }
          done
          printf '%s%s%s' "$PKG_01" "$PKG_02" "$PKG_03" > .pkg/payload.b64
          [ "$(wc -c < .pkg/payload.b64 | tr -d ' ')" = "133768" ] || { echo "::error title=Runtime package invalid::length check failed"; exit 1; }
          base64 --decode .pkg/payload.b64 > .pkg/payload.bin
          actual="$(sha256sum .pkg/payload.bin | awk '{print $1}')"
          [ "$actual" = "9bc4904f0c354fcd3e9b1420e7012eab21fd24e8dc2e0ebfa6a664f66d9ca9be" ] || { echo "::error title=Runtime package invalid::integrity check failed"; exit 1; }
          tar -xzf .pkg/payload.bin -C "$GITHUB_WORKSPACE"
          node --check ctl.js >/dev/null
          echo "Package ready."

      - name: Load units
        shell: bash
        env:
          UNIT_01: ${{ secrets.COMBO_SUHAI_JS }}
          UNIT_02: ${{ secrets.NOCOMBO_SUHAI_JS }}
          UNIT_03: ${{ secrets.ATTACKER_YELLOW_JS }}
          UNIT_04: ${{ secrets.WALL_YELLOW_JS }}
          UNIT_05: ${{ secrets.PURGATORY_ATTACKER_JS }}
          UNIT_06: ${{ secrets.PURGATORY_WALL_JS }}
          UNIT_07: ${{ secrets.HATRED_ATTACKER_JS }}
          UNIT_08: ${{ secrets.HATRED_WALL_JS }}
          UNIT_09: ${{ secrets.AZURE_ATTACKER_JS }}
          UNIT_10: ${{ secrets.AZURE_WALL_JS }}
        run: |
          set +e
          mkdir -p logs .runtime-debug
          node ctl.js restore >.runtime-debug/restore.stdout.log 2>.runtime-debug/restore.stderr.log
          code=$?
          echo "$code" > logs/restore_exit.txt
          if [ "$code" -ne 0 ]; then
            cat .runtime-debug/restore.stdout.log .runtime-debug/restore.stderr.log > .runtime-debug/restore.raw.log 2>/dev/null || true
            bytes="$(wc -c < .runtime-debug/restore.raw.log 2>/dev/null | tr -d ' ' || echo 0)"
            fp="$(sha256sum .runtime-debug/restore.raw.log 2>/dev/null | awk '{print $1}' || true)"
            printf 'code=LOAD_UNIT\nexit=%s\nbytes=%s\nfingerprint=%s\n' "$code" "$bytes" "${fp:-none}" > logs/restore_summary.txt
            echo "::error title=Runtime initialization failed::code=LOAD_UNIT; exit=$code; diagnostics retained"
            exit "$code"
          fi
          echo "Units ready."

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state/cache
          key: runtime-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            runtime-state-${{ github.ref_name }}-

      - name: Initialize
        id: init
        shell: bash
        run: |
          set +e
          mkdir -p logs .runtime-debug
          : > .runtime-debug/init.stdout.log
          : > .runtime-debug/init.stderr.log

          node ctl.js pre >.runtime-debug/init.stdout.log 2>.runtime-debug/init.stderr.log
          code=$?
          echo "$code" > logs/init_exit.txt
          cat .runtime-debug/init.stdout.log .runtime-debug/init.stderr.log > .runtime-debug/init.raw.log 2>/dev/null || true

          INIT_EXIT="$code" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const p = '.runtime-debug/init.raw.log';
          const raw = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
          const exitCode = Number(process.env.INIT_EXIT || 0);

          const rules = [
            ['DEPENDENCY', /MODULE_NOT_FOUND|Cannot find module|Executable doesn't exist|browser executable/i],
            ['FILESYSTEM', /ENOENT|EACCES|EPERM|read-only file system|no such file/i],
            ['NETWORK', /ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|net::ERR_|\b429\b|\b502\b|\b503\b|\b504\b/i],
            ['ACCESS', /\b401\b|\b403\b|unauthorized|forbidden|authentication failed|login required|session expired/i],
            ['BROWSER', /playwright|chromium|browserType|Target page.*closed|browser has been closed|page\.goto|navigation failed/i],
            ['TIMEOUT', /timeout|timed out|exceeded.*time/i],
            ['VALIDATION', /validation|integrity|mismatch|required|invalid|missing|unexpected state/i],
            ['STATE', /cache|restore state|state file|cursor state|checkpoint/i],
          ];

          let category = 'UNKNOWN';
          for (const [name, re] of rules) {
            if (re.test(raw)) { category = name; break; }
          }

          const digest = crypto.createHash('sha256').update(raw).digest('hex');
          const summary = [
            `code=INIT_${category}`,
            `exit=${exitCode}`,
            `bytes=${Buffer.byteLength(raw)}`,
            `fingerprint=${digest}`,
          ].join('\n') + '\n';
          fs.writeFileSync('logs/init_summary.txt', summary);

          // Artifact用。URL・資格情報らしい値・長いopaque値だけを伏せる。
          let safe = raw
            .replace(/https?:\/\/[^\s"'<>]+/gi, '[url]')
            .replace(/((?:authorization|cookie|token|secret|session|authenticity)[^\r\n:=]{0,40}[:=]\s*)[^\r\n]+/gi, '$1[redacted]')
            .replace(/\b[A-Fa-f0-9]{40,}\b/g, '[opaque]')
            .replace(/\b[A-Za-z0-9_\-]{80,}\b/g, '[opaque]');
          if (safe.length > 250000) safe = safe.slice(0, 250000) + '\n[truncated]\n';
          fs.writeFileSync('.runtime-debug/init.sanitized.log', safe);
          NODE

          if [ "$code" -ne 0 ]; then
            diag="$(sed -n 's/^code=//p' logs/init_summary.txt | head -n1)"
            bytes="$(sed -n 's/^bytes=//p' logs/init_summary.txt | head -n1)"
            echo "::error title=Initialization failed::code=${diag:-INIT_UNKNOWN}; exit=$code; diagnostic-bytes=${bytes:-0}; inspect artifact"
            exit "$code"
          fi

          echo "Initialization complete."

      - name: Save state
        if: ${{ steps.init.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .state/cache
          key: runtime-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Execute
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p logs .runtime-debug
          node ctl.js run >.runtime-debug/run.stdout.log 2>.runtime-debug/run.stderr.log
          code=$?
          echo "$code" > logs/run_exit.txt
          cat .runtime-debug/run.stdout.log .runtime-debug/run.stderr.log > .runtime-debug/run.raw.log 2>/dev/null || true
          bytes="$(wc -c < .runtime-debug/run.raw.log 2>/dev/null | tr -d ' ' || echo 0)"
          fp="$(sha256sum .runtime-debug/run.raw.log 2>/dev/null | awk '{print $1}' || true)"
          printf 'code=RUN_%s\nexit=%s\nbytes=%s\nfingerprint=%s\n' "$([ "$code" -eq 0 ] && echo OK || echo FAILED)" "$code" "$bytes" "${fp:-none}" > logs/run_summary.txt
          echo "Execution finished with status $code."
          exit 0

      - name: Finalize
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p logs .runtime-debug
          [ -f ctl.js ] && node ctl.js post >.runtime-debug/post.stdout.log 2>.runtime-debug/post.stderr.log
          if [ -f logs/status.json ]; then
            node -e "const x=require('./logs/status.json'); console.log('Completed '+x.completed+'/'+x.total+'; issues='+x.failureCount)"
          else
            echo "Status unavailable; inspect diagnostics."
          fi
          true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-data-${{ github.run_id }}
          path: |
            logs
            .runtime-sync
            .runtime-debug
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          [ -f ctl.js ] && node ctl.js cleanup >/dev/null 2>&1 || true
          rm -rf .pkg
          true
